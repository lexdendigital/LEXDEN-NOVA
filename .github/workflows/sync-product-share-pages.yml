name: Sync product share preview pages

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-product-share-pages.js"
      - "scripts/generate-sitemap.js"
      - ".github/workflows/sync-product-share-pages.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: product-share-preview-sync
  cancel-in-progress: false

jobs:
  sync-product-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate per-product preview pages from live Firestore
        run: node scripts/generate-product-share-pages.js

      - name: Generate sitemap.xml from the same live catalog
        run: node scripts/generate-sitemap.js

      - name: Commit generated catalog changes
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/ sitemap.xml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Product pages and sitemap already match the live catalog."
            exit 0
          fi
          git commit -m "Sync product pages and sitemap from live catalog"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request a GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/pages/builds"
