# Keeps the free Render instance awake (it sleeps after 15 min idle).
# Pings /health every 10 minutes. Free on public repos.
name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 60 https://lexden-nova.onrender.com/health && exit 0
            sleep 15
          done
          exit 0
