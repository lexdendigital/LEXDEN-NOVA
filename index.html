function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function escapeHtml(str){ return String(str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Turns bare URLs in already-escaped text into clickable links. Runs
// AFTER escapeHtml, so it matches against entity-encoded text (e.g. a
// query string "&" is by then "&amp;") — that's fine, since the browser
// decodes entities inside the href attribute the same way it does in text.
function linkifyText(escapedText){
  const urlRe = /((https?:\/\/|www\.)[^\s<]+[^\s<.,;:!?'"”’)\]])/gi;
  return escapedText.replace(urlRe, (m)=>{
    const href = /^https?:\/\//i.test(m) ? m : 'https://'+m;
    return `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color:var(--accent);word-break:break-all;">${m}</a>`;
  });
}
// Renders admin-pasted feed body text so it actually reads the way it was
// written: blank lines become real paragraph breaks, single line breaks
// are preserved, and any bare URL becomes a tappable link. Without this,
// a plain <p>${escapeHtml(text)}</p> collapses every blank line pasted
// from elsewhere into one run-on blob, since HTML ignores whitespace by
// default — that's the "feed text not well formatted" bug.
function formatFeedText(text){
  const raw = String(text||'').trim();
  if(!raw) return '';
  return raw.split(/\n\s*\n/).map(para=>{
    const esc = escapeHtml(para.trim()).replace(/\n/g,'<br>');
    return `<p style="margin:0 0 14px;">${linkifyText(esc)}</p>`;
  }).join('');
}
function currentCurrency(){ return lsGet(LS_KEYS.currency, DB.content.displayCurrency || 'NGN'); }
function setCurrency(code){ lsSet(LS_KEYS.currency, code); render(); }
// Small shared helpers so every place that needs "the shopper's current
// currency's rate/symbol" (product prices, and the custom price-range
// inputs) reads it the exact same way instead of re-deriving it locally.
function currentRate(){ const c = DB.content; return (c.exchangeRates && c.exchangeRates[currentCurrency()]) || 1; }
function currentCurrencySymbol(){ const c = DB.content; return (c.currencySymbols && c.currencySymbols[currentCurrency()]) || currentCurrency()+' '; }
function round2(n){ return Math.round(n*100)/100; }
function fmtPrice(usdAmount){
  const c = DB.content;
  const code = currentCurrency();
  const rate = (c.exchangeRates && c.exchangeRates[code]) || 1;
  const symbol = (c.currencySymbols && c.currencySymbols[code]) || code+' ';
  const converted = Number(usdAmount) * rate;
  // Whole-number currencies (e.g. Naira) read oddly with decimals for small demo prices,
  // but we keep 2dp for anything under 100 units so cheap items don't round to 0/1.
  const decimals = converted >= 100 ? 0 : 2;
  return symbol + converted.toLocaleString(undefined,{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}
// A product with no price, or a price of 0, is treated as Free everywhere —
// storefront cards, the product page, and NOVA AI's own understanding of the catalog.
function isFreeProduct(p){ return !p || p.price===null || p.price===undefined || Number(p.price)<=0; }
// Matches by the category's NAME (containing "course"), not its id — ids
// are slugified once at creation time and never renamed, but an admin can
// rename the category's display name later, and matching on id alone would
// silently stop working the moment they did. This stays correct either way.
function isCourseProduct(p){
  if(!p || !p.category) return false;
  const cat = DB.categories.find(c=>c.id===p.category);
  return !!(cat && /course/i.test(cat.name||''));
}
function discountPercent(p){
  if(!p || isFreeProduct(p) || !p.salePrice || Number(p.salePrice)>=Number(p.price)) return 0;
  return Math.round((1 - (Number(p.salePrice)/Number(p.price))) * 100);
}
function priceLabel(p){
  if(isFreeProduct(p)) return 'Free';
  const hasSale = p.salePrice && p.salePrice < p.price;
  return fmtPrice(hasSale ? p.salePrice : p.price);
}
async function tryRefreshExchangeRates(){
  const c = DB.content;
  const last = c.ratesUpdatedAt ? new Date(c.ratesUpdatedAt) : null;
  const dayMs = 24*60*60*1000;
  if(last && (Date.now()-last.getTime()) < dayMs) return; // at most once/day, saves data
  if(!navigator.onLine) return;
  try{
    const res = await fetch('https://open.er-api.com/v6/latest/USD');
    if(!res.ok) return;
    const data = await res.json();
    if(data && data.result==='success' && data.rates){
      const keep = Object.keys(c.exchangeRates);
      const updated = {...c.exchangeRates};
      keep.forEach(code=>{ if(data.rates[code]) updated[code] = data.rates[code]; });
      DB.content = {...c, exchangeRates:updated, ratesUpdatedAt:new Date().toISOString()};
      logActivity('System', 'Auto-updated currency exchange rates');
      render();
    }
  }catch(e){ /* offline or blocked — admin-set rates keep working */ }
}
function starString(rating){

// The seed catalog originally shipped with made-up rating/reviewCount
// numbers on each product (e.g. "212 reviews" when zero real reviews
// existed). Every rating and review count shown anywhere in the app now
// comes from this function instead — it's computed live from the actual
// reviews people have submitted (DB.testimonials), so the figures shown
// are always real. A product with no submitted reviews yet correctly
// shows 0 reviews rather than an invented number.
function liveRatingStats(p){
  const reviews = DB.testimonials.filter(t=>t.productId===p.id);
  if(!reviews.length) return { rating:0, count:0 };
  const avg = reviews.reduce((s,r)=>s+(r.rating||0),0) / reviews.length;
  return { rating: Math.round(avg*10)/10, count: reviews.length };
}

/* ---------------- AI/SEO STRUCTURED DATA ----------------
   Keeps <title>, meta description/OG/Twitter tags, canonical URL, and
   JSON-LD in sync with whatever screen is showing. This is what lets an
   external AI (or a search crawler) given just the page URL understand
   the site: product name, price, currency, discount, availability
   (including "free"), ratings, and a machine-readable catalog summary —
   without scraping visual HTML.

   BUGFIX (indexing): this used to only touch <title> and the meta
   description. Google generally treats a #hash fragment as part of the
   SAME url as the page without it — the fragment is never even sent to
   the server — so no matter how good the per-product JS-set tags were,
   the whole site could only ever earn ONE indexed result: the homepage.
   Individual products/feed posts could never rank on their own.
   NOVA_LINKS_BASE (below) already serves a real, distinct, crawlable
   page per product/feed post — it was only ever wired up for share
   links. Pointing the canonical link + og:url + twitter:url at THAT url
   instead of the bare homepage whenever a product/feed post is open is
   what actually gives each item a shot at being indexed and found
   separately — the rest of this block (title/description/OG/JSON-LD)
   is what makes that page worth ranking once it's crawled. */
function setMeta(name, content, isProperty){
  const attr = isProperty ? 'property' : 'name';
  let tag = document.querySelector(`meta[${attr}="${name}"]`);
  if(!tag){ tag = document.createElement('meta'); tag.setAttribute(attr, name); document.head.appendChild(tag); }
  tag.setAttribute('content', content);
}
function setCanonical(url){
  const link = document.getElementById('canonicalLink');
  if(link) link.setAttribute('href', url);
  setMeta('og:url', url, true);
  setMeta('twitter:url', url);
}
function setJsonLd(id, obj){
  let tag = document.getElementById(id);
  if(!obj){ if(tag) tag.remove(); return; }
  if(!tag){ tag = document.createElement('script'); tag.type = 'application/ld+json'; tag.id = id; document.head.appendChild(tag); }
  tag.textContent = JSON.stringify(obj);
}
const SITE_URL = 'https://lexdendigital.github.io/LEXDEN-NOVA/index.html';
function productToSchema(p){
  const stats = liveRatingStats(p);
  return {
    '@type':'Product', name:p.name, sku:p.itemCode, description:p.description,
    image:p.image, category:p.category,
    aggregateRating: stats.count ? {'@type':'AggregateRating', ratingValue:stats.rating, reviewCount:stats.count} : undefined,
    offers:{
      '@type':'Offer',
      price: isFreeProduct(p) ? '0.00' : (p.salePrice||p.price).toFixed(2),
      priceCurrency:'USD',
      availability: isFreeProduct(p) ? 'https://schema.org/InStock' : 'https://schema.org/InStock',
      url: NOVA_LINKS_BASE+'/product/'+p.id,
    },
  };
}
// Standard "you are here" trail — Google shows this instead of the raw URL
// in results, and it's a ranking signal for how the page fits the site.
function breadcrumbSchema(crumbs){
  return {
    '@context':'https://schema.org', '@type':'BreadcrumbList',
    itemListElement: crumbs.map((c,i)=>({'@type':'ListItem', position:i+1, name:c.name, item: c.url})),
  };
}
function updateSeoForRoute(hash){
  const c = DB.content;
  const appName = c.appName||'LEXDEN NOVA';
  const defaultImg = document.querySelector('meta[property="og:image"]')?.getAttribute('content') || '';

  if(hash.startsWith('#product/')){
    const p = findProduct(hash.split('/')[1]);
    if(p){
      const desc = p.description.slice(0,160);
      const url = NOVA_LINKS_BASE+'/product/'+p.id;
      const cat = DB.categories.find(x=>x.id===p.category);
      document.title = `${p.name} — ${appName}`;
      setMeta('description', desc);
      setMeta('og:title', `${p.name} — ${appName}`, true);
      setMeta('og:description', desc, true);
      if(p.image) setMeta('og:image', p.image, true);
      setMeta('twitter:title', `${p.name} — ${appName}`);
      setMeta('twitter:description', desc);
      if(p.image) setMeta('twitter:image', p.image);
      setCanonical(url);
      setJsonLd('productSchema', {'@context':'https://schema.org', ...productToSchema(p)});
      setJsonLd('breadcrumbSchema', breadcrumbSchema([
        {name:'Home', url: SITE_URL+'#home'},
        {name:'Products', url: SITE_URL+'#products'},
        ...(cat?[{name:cat.name, url: SITE_URL+'#products'}]:[]),
        {name:p.name, url},
      ]));
      setJsonLd('faqSchema', null);
      return;
    }
  }
  if(hash.startsWith('#feed/')){
    const post = DB.feed.find(x=>x.id===hash.split('/')[1]);
    if(post){
      const desc = firstParagraph(post.body||'', 160);
      const url = NOVA_LINKS_BASE+'/feed/'+post.id;
      const img = (post.media && post.media[0] && post.media[0].url) || defaultImg;
      document.title = `${post.title} — ${appName}`;
      setMeta('description', desc);
      setMeta('og:title', `${post.title} — ${appName}`, true);
      setMeta('og:description', desc, true);
      if(img) setMeta('og:image', img, true);
      setMeta('twitter:title', `${post.title} — ${appName}`);
      setMeta('twitter:description', desc);
      if(img) setMeta('twitter:image', img);
      setCanonical(url);
      setJsonLd('productSchema', null);
      setJsonLd('breadcrumbSchema', breadcrumbSchema([
        {name:'Home', url: SITE_URL+'#home'},
        {name:post.title, url},
      ]));
      setJsonLd('faqSchema', null);
      return;
    }
  }
  if(hash === '#service'){
    document.title = `Services & FAQ — ${appName}`;
    setMeta('description', `What we can build for you, plus answers to common questions about ${appName}.`);
    setMeta('og:title', `Services & FAQ — ${appName}`, true);
    setMeta('og:description', `What we can build for you, plus answers to common questions about ${appName}.`, true);
    if(defaultImg) setMeta('og:image', defaultImg, true);
    setMeta('twitter:title', `Services & FAQ — ${appName}`);
    setMeta('twitter:description', `What we can build for you, plus answers to common questions about ${appName}.`);
    // Query-string (not hash) so this is at least a distinct, crawlable
    // URL for the FAQ content, even though it's the same static file.
    setCanonical(SITE_URL+'?service=1');
    setJsonLd('productSchema', null);
    setJsonLd('breadcrumbSchema', breadcrumbSchema([{name:'Home', url: SITE_URL+'#home'},{name:'Service & FAQ', url: SITE_URL+'?service=1'}]));
    if(DB.faqs && DB.faqs.length){
      setJsonLd('faqSchema', {
        '@context':'https://schema.org', '@type':'FAQPage',
        mainEntity: DB.faqs.map(f=>({'@type':'Question', name:f.q, acceptedAnswer:{'@type':'Answer', text:f.a}})),
      });
    } else setJsonLd('faqSchema', null);
    return;
  }
  document.title = appName;
  setMeta('description', c.heroSub||'');
  setMeta('og:title', appName, true);
  setMeta('og:description', c.heroSub||'', true);
  if(defaultImg) setMeta('og:image', defaultImg, true);
  setMeta('twitter:title', appName);
  setMeta('twitter:description', c.heroSub||'');
  setCanonical(SITE_URL);
  setJsonLd('productSchema', null);
  setJsonLd('breadcrumbSchema', null);
  setJsonLd('faqSchema', null);
}

// BUGFIX ("page keeps jumping to the top / blinking on its own"): render()
// used to unconditionally scroll to top and rebuild #app every single time
// it ran — but render() isn't only called on navigation. Background events
// (an order-status Firestore listener, the once-a-day exchange-rate
// refresh, auth-state changes, a currency switch) all call render() too,
// on whatever screen the shopper currently has open. Because those fired
// on a timer/listener rather than a tap, the shopper would suddenly get
// yanked to the top of the page — and because #app was torn down and
// rebuilt from a string every time, images/inputs would flash. The fix:
// only actually scroll to top (and treat this as a "hard" navigation) when
// the route genuinely changed since the last render. A same-route render
// (background data refresh) rebuilds the content but leaves scroll position
// and focus alone.
let __lastRenderedRoute = null;
function render(){
  const hash = currentRoute();
  const isNavigation = hash !== __lastRenderedRoute;
  appState.route = hash;
  // Keep NOVA's quick-reply chips in sync with wherever the shopper just
  // navigated to, even if the panel stays open across the page change.
  if(appState.novaOpen) renderQuickReplies();
  const app = $('#app');
  if(isNavigation){
    window.scrollTo({top:0, behavior:'auto'});
    __lastRenderedRoute = hash;
    app.classList.remove('no-anim');
  } else {
    app.classList.add('no-anim');
  }

  if(hash === '#debuglog'){ app.innerHTML = screenDebugLog(); afterDebugLogRender(); return; }
  if(hash === '#admin'){ renderAdmin(); return; }
  if(hash === '#login'){ app.innerHTML = screenLogin(); afterAuthRender(); return; }
  if(hash === '#signup'){ app.innerHTML = screenSignup(); afterAuthRender(); return; }

  let body = '';
  if(hash.startsWith('#product/')){
    const __pid = hash.split('/')[1];
    if(isNavigation) trackProductView(__pid);
    body = screenProductDetail(__pid);
  } else if(hash.startsWith('#feed/')){
    const __fpid = hash.split('/')[1];
    if(isNavigation) trackFeedView(__fpid);
    body = screenFeedDetail(__fpid);
  } else if(hash === '#feed'){
    if(isNavigation) appState.feedShownCount = 12;
    body = screenFeedList();
  } else if(hash === '#products'){
    body = screenProducts();
  } else if(hash === '#service'){
    body = screenService();
  } else if(hash === '#wishlist'){
    body = screenWishlist();
  } else if(hash === '#profile'){
    body = screenProfile();
  } else if(hash === '#account'){
    body = screenAccount();
  } else if(hash === '#orders'){
    body = screenOrders();
  } else if(hash === '#menu'){
    body = screenMenu();
  } else if(hash === '#settings'){
    body = screenSettings();
  } else if(hash === '#about'){
    body = screenAbout();
  } else {
    body = screenHome();
  }

  app.innerHTML = topBanner() + shellHeader() + body + shellBottomNav() + '<div class="status-fill" style="display:none"></div>';
  afterRender(hash);
}

/* ---------------- ON-DEVICE DEBUG LOG ----------------
   Type /#debuglog onto the end of the site URL, on the phone itself, to
   read back everything window.__novaLog() has recorded — newest first —
   with a one-tap Copy so it can be pasted into a message. No computer,
   no cable, no chrome://inspect required. */
function screenDebugLog(){
  let list = [];
  try{ list = JSON.parse(localStorage.getItem('ln_debug_log') || '[]'); }catch(e){}
  const rows = list.slice().reverse().map(e=>{
    const d = new Date(e.t);
    const time = d.toLocaleString();
    return `<div style="padding:10px 12px;border-bottom:1px solid var(--border,#e5e5e5);font-family:monospace;font-size:12px;line-height:1.5;">
      <div style="opacity:.6;">${time}</div>
      <div>${(e.msg||'').replace(/</g,'&lt;')}</div>
    </div>`;
  }).join('') || `<div style="padding:20px;text-align:center;opacity:.6;">No log entries yet.</div>`;
  return `
  <div style="min-height:100vh;background:var(--bg,#fff);">
    <div style="position:sticky;top:0;background:var(--card,#fff);padding:14px 16px;border-bottom:1px solid var(--border,#e5e5e5);display:flex;align-items:center;gap:10px;z-index:5;">
      <button onclick="navigate('#home')" style="border:none;background:none;font-size:20px;">←</button>
      <div style="font-weight:700;flex:1;">Debug Log (${list.length})</div>
      <button id="dbgCopyBtn" style="border:1px solid var(--border,#ccc);background:none;border-radius:8px;padding:6px 10px;font-size:13px;">Copy</button>
      <button id="dbgClearBtn" style="border:1px solid var(--border,#ccc);background:none;border-radius:8px;padding:6px 10px;font-size:13px;">Clear</button>
    </div>
    <div>${rows}</div>
  </div>`;
}
function afterDebugLogRender(){
  const copyBtn = $('#dbgCopyBtn');
  const clearBtn = $('#dbgClearBtn');
  if(copyBtn) copyBtn.onclick = async ()=>{
    let list = [];
    try{ list = JSON.parse(localStorage.getItem('ln_debug_log') || '[]'); }catch(e){}
    const text = list.map(e=> new Date(e.t).toLocaleString() + '  ' + e.msg).join('\n');
    try{ await navigator.clipboard.writeText(text || '(empty)'); toast('Log copied','success'); }
    catch(e){ toast('Could not copy — long-press to select text manually','error'); }
  };
  if(clearBtn) clearBtn.onclick = ()=>{
    localStorage.removeItem('ln_debug_log');
    render();
  };
}

// PHASE 3: one banner slot, two possible occupants. An update takes
// priority over an install nudge — if both are true, getting the person
// onto the latest code matters more than the install pitch.
function topBanner(){
  if(appState.updateAvailable){
    return `<div class="top-banner">

      <span class="msg">A new version of NOVA is ready.</span>
      <button class="btn btn-primary btn-sm" onclick="applyUpdate()">Refresh</button>

  }
  if(appState.canInstall && !isStandalone() && !lsGet(LS_KEYS.installDismissed, false)){
    return `<div class="top-banner">

let deferredInstallPrompt = null;
function triggerInstallPrompt(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.then(choice=>{
    logActivity('User', `Install prompt outcome: ${choice.outcome}`);
    deferredInstallPrompt = null;
    appState.canInstall = false;
    render();
  });
}
// Single entry point for every "Install App" affordance in the app (Profile
// menu row, NOVA's own answer, anywhere else). Always tries the browser's
// real native install prompt FIRST; the manual step-by-step instructions
// only ever show as a fallback, and only when the native prompt genuinely
// isn't available or didn't fire — never as the first thing shown.
function handleInstallAction(){
  if(isStandalone()){
    toast('You already have NOVA installed on this device', 'info');
    return;
  }
  if(deferredInstallPrompt){
    // Native path — the real browser install prompt.
    triggerInstallPrompt();
    return;
  }
  // Native prompt unavailable on this browser (iOS Safari, desktop
  // Safari/Firefox, or a Chromium browser that hasn't fired
  // beforeinstallprompt yet) — this is the ONLY path that reaches the
  // manual instructions, i.e. exactly the "only when it fails" behavior.
  showInstallInstructions();
}
// There is no browser API that can silently trigger "add to home screen" —
// only the browser's own beforeinstallprompt flow (handled above) can do
// that, and only where the browser supports it. Where it isn't available
// (iOS Safari, desktop Safari/Firefox, or Chrome/Edge before the prompt has
// fired), the closest honest equivalent is a button that opens the exact
// steps for the device we detect, so shoppers aren't stuck reading generic
// text — this replaces the old plain-text fallback.
function detectInstallPlatform(){
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const isSafari = /Safari/.test(ua) && !/Chrome|CriOS|FxiOS|EdgiOS/.test(ua);
  const isAndroid = /Android/.test(ua);
  const isFirefox = /Firefox/.test(ua) && !isAndroid;
  if(isIOS && isSafari) return 'ios-safari';
  if(isIOS) return 'ios-other';
  if(isAndroid) return 'android';
  if(isFirefox) return 'desktop-firefox';
  if(/Edg\//.test(ua)) return 'desktop-edge';
  if(/Chrome/.test(ua)) return 'desktop-chrome';
  if(isSafari) return 'desktop-safari';
  return 'other';
}

/* ---------------- PRODUCTS (catalog) ---------------- */
function filteredProducts(){
  const f = appState.productFilters;
  let list = DB.products.filter(p=>p.status!=='draft');
  if(f.category !== 'all') list = list.filter(p=>p.category===f.category);
  if(f.price==='u10') list = list.filter(p=>(p.salePrice||p.price) < 10);
  if(f.price==='10-50') list = list.filter(p=>{ const pr=p.salePrice||p.price; return pr>=10 && pr<=50; });
  if(f.price==='50p') list = list.filter(p=>(p.salePrice||p.price) > 50);
  if(f.price==='custom'){
    const min = f.priceMin!=null ? Number(f.priceMin) : null;
    const max = f.priceMax!=null ? Number(f.priceMax) : null;
    list = list.filter(p=>{
      const pr = p.salePrice||p.price||0;
      if(min!=null && !isNaN(min) && pr < min) return false;
      if(max!=null && !isNaN(max) && pr > max) return false;
      return true;
    });
  }
  if(f.q) list = list.filter(p=>(p.name+' '+p.description+' '+(p.tags||[]).join(' ')).toLowerCase().includes(f.q.toLowerCase()));
  if(f.sort==='popular') list = list.sort((a,b)=>b.reviewCount-a.reviewCount);
  if(f.sort==='newest') list = list.slice().reverse();
  if(f.sort==='cheap') list = list.sort((a,b)=>(a.salePrice||a.price)-(b.salePrice||b.price));
  if(f.sort==='rated') list = list.sort((a,b)=>b.rating-a.rating);
  return list;
}

function priceFilterLabel(f){

    if(min!=null && max!=null) return `${fmtPrice(min)}–${fmtPrice(max)}`;

// Custom price-range control — built entirely from ordinary divs/buttons/
// number inputs rather than a native <select>/<input type=range>, per
// request, so it can be styled and positioned like the rest of the app's
// UI instead of inheriting the OS/browser's own picker chrome. Simplified
// per request to just Min/Max — the old preset chips (Under $10, $10-$50,
// $50+) are gone; a shopper types their own range instead.
function priceFilterPopoverHtml(f){
  return `
  <div class="card" style="position:absolute;top:calc(100% + 6px);left:0;z-index:60;padding:14px;width:240px;box-shadow:var(--shadow-card);" onclick="event.stopPropagation();">
    <div class="text-2 small" style="font-weight:600;margin-bottom:6px;">Price range <span style="font-weight:400;">(${escapeHtml(currentCurrencySymbol().trim())})</span></div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
      <input type="number" inputmode="decimal" min="0" step="0.01" id="priceMinInput" placeholder="Min ${escapeHtml(currentCurrencySymbol().trim())}" value="${f.priceMin!=null?round2(f.priceMin*currentRate()):''}"
        style="width:0;flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px;color:var(--text);font-size:13px;">
      <span class="text-2">–</span>
      <input type="number" inputmode="decimal" min="0" step="0.01" id="priceMaxInput" placeholder="Max ${escapeHtml(currentCurrencySymbol().trim())}" value="${f.priceMax!=null?round2(f.priceMax*currentRate()):''}"
        style="width:0;flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px;color:var(--text);font-size:13px;">
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary btn-sm" style="flex:1;" onclick="applyCustomPriceRange()">Apply</button>
      <button class="btn btn-ghost btn-sm" onclick="clearPriceFilter()">Clear</button>
    </div>
  </div>`;
}
function togglePriceFilterPopover(){
  appState.priceFilterOpen = !appState.priceFilterOpen;
  rerenderProductList();
}
function clearPriceFilter(){
  appState.productFilters.price = 'all';
  appState.productFilters.priceMin = null;
  appState.productFilters.priceMax = null;
  appState.priceFilterOpen = false;
  rerenderProductList();
}
function applyCustomPriceRange(){
  const minEl = $('#priceMinInput'), maxEl = $('#priceMaxInput');
  // Whatever the shopper types is in THEIR current display currency (that's
  // what the input placeholders/label now show) — not USD. Product prices
  // are stored internally in USD (see fmtPrice), so we convert the entered
  // numbers back to USD here using the same rate fmtPrice uses, before
  // comparing/storing. Validate min>max on the raw entered numbers first
  // (same currency, so the ordering is unaffected by the conversion).
  const rate = currentRate();
  const minEntered = minEl && minEl.value!=='' ? parseFloat(minEl.value) : null;
  const maxEntered = maxEl && maxEl.value!=='' ? parseFloat(maxEl.value) : null;
  if(minEntered!=null && maxEntered!=null && minEntered > maxEntered){
    toast('Min price can\'t be higher than max');

  appState.productFilters.priceMin = min;
  appState.productFilters.priceMax = max;
  appState.priceFilterOpen = false;
  rerenderProductList();

/* Detects the real platform behind a pasted URL (YouTube, TikTok, Vimeo,
   Facebook, Instagram, direct video file, or plain image) and builds an
   embeddable URL where needed, so admins can paste any normal share link
   and it just works — no manual "embed code" wrangling required. */
function parseMediaUrl(raw){
  const url = (raw||'').trim();
  if(!url) return null;
  let m = url.match(/(?:youtube\.com\/watch\?v=|youtube\.com\/shorts\/|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/live\/)([\w-]{6,})/i);
  if(m) return {type:'embed', platform:'youtube', url, embed:`https://www.youtube.com/embed/${m[1]}`};
  m = url.match(/tiktok\.com\/[^/]+\/video\/(\d+)/i);
  if(m) return {type:'embed', platform:'tiktok', url, embed:`https://www.tiktok.com/embed/v2/${m[1]}`};
  if(/tiktok\.com\//i.test(url)) return {type:'embed', platform:'tiktok', url, embed:`https://www.tiktok.com/embed/v2/${encodeURIComponent(url)}`};
  m = url.match(/vimeo\.com\/(\d+)/i);
  if(m) return {type:'embed', platform:'vimeo', url, embed:`https://player.vimeo.com/video/${m[1]}`};
  if(/facebook\.com\/.+\/videos\/|fb\.watch\//i.test(url)) return {type:'embed', platform:'facebook', url, embed:`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=false`};
  if(/instagram\.com\/(reel|p|tv)\//i.test(url)) return {type:'embed', platform:'instagram', url, embed:`${url.replace(/\/$/,'')}/embed`};
  if(/\.(mp4|webm|mov|m4v|ogg)(\?|#|$)/i.test(url)) return {type:'video', url};
  return {type:'image', url};
}
function normalizeMedia(item){
  if(!item) return null;
  const url = (typeof item === 'object' && item.url) ? item.url : item;
  return parseMediaUrl(url);
}
function guessMediaType(url){ const m = parseMediaUrl(url); return m ? m.type : 'image'; }

/* Shared Cloudinary unsigned-upload helper. Every "upload from device"
   button in the app (product gallery, feed post media, branding logo,
   signup avatar) funnels through this one function, so there's a single
   implementation to maintain and — importantly — a single place that
   surfaces Cloudinary's OWN error message back to whoever's uploading,
   instead of a generic "upload failed" that hides the real reason
   (wrong preset name, preset still signed, unsupported file type, etc).
   Throws an Error with a human-readable message on any failure. */
/* Media speed fix: every upload was being displayed at its full original
   size — a multi-megabyte photo or video downloaded in full just to show
   a small thumbnail. Cloudinary can resize/compress on the fly via its
   URL, so this rewrites any Cloudinary-hosted URL to request the best
   format for the viewer's browser (f_auto), the best quality for that
   format (q_auto), and a sensible max width — which is the single
   biggest lever for "media taking too long to load". Pasted external
   links (not hosted on Cloudinary) are returned unchanged. */
function cldOptimize(url, width){
  if(!url || typeof url !== 'string') return url;
  const marker = '/upload/';
  const idx = url.indexOf(marker);
  if(!url.includes('res.cloudinary.com') || idx===-1) return url;
  if(/\/upload\/[^/]*f_auto/.test(url)) return url; // already optimized
  const w = width ? `,w_${width}` : '';
  return url.slice(0, idx+marker.length) + `f_auto,q_auto${w}/` + url.slice(idx+marker.length);
}
// Downscales + re-encodes a profile-picture file client-side before it's
// uploaded — phone camera photos are routinely several MB, which is why
// avatar uploads kept stalling/"failing" repeatedly on a slow mobile
// connection (visible upload speeds as low as ~2-8 KB/s make an 8MB photo
// take the better part of an hour, well past any sane timeout). Shrinking
// to at most maxDim on the longest side and re-encoding as JPEG typically
// takes a multi-MB photo down to well under 200KB, which uploads reliably
// even on a very slow connection. Falls back to the original, untouched
// file if anything about the resize itself goes wrong (unsupported
// format, canvas failure, etc.) so a resize bug can never be the reason a
// photo doesn't upload at all.
function resizeAvatarImage(file, maxDim, quality){
  maxDim = maxDim || 640; quality = quality || 0.82;
  return new Promise(resolve=>{
    if(!file || !file.type || !file.type.startsWith('image/') || file.type==='image/svg+xml'){ resolve(file); return; }
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        try{
          const { width, height } = img;
          if(width<=maxDim && height<=maxDim){ resolve(file); return; }
          const scale = maxDim / Math.max(width, height);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(width*scale);
          canvas.height = Math.round(height*scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(blob=>{
            if(!blob){ resolve(file); return; }
            resolve(new File([blob], (file.name||'avatar').replace(/\.\w+$/,'')+'.jpg', {type:'image/jpeg'}));
          }, 'image/jpeg', quality);
        }catch(e){ console.warn('Avatar resize failed, uploading original', e); resolve(file); }
      };
      img.onerror = ()=>resolve(file);
      img.src = e.target.result;
    };
    reader.onerror = ()=>resolve(file);
    reader.readAsDataURL(file);
  });
}
/* ---------------- ERROR CODES ----------------
   Some upload failures are things only an admin can fix (a Cloudinary
   preset misconfigured, the upload server unreachable, a garbled server
   response) — showing the raw technical message for those to a shopper
   (or even to the admin, repeatedly, mid-task) reads as broken and gives
   them nothing to act on. Those get a short, stable code instead — the
   same underlying cause always maps to the same code — and the code's
   real explanation + fix live in one place: the admin portal's "Error
   Codes" tab (see adminErrorCodes()), sourced from this exact object so
   the two can never drift apart. Plain user-actionable messages (wrong
   file type, a slow connection) are left as normal English — a code
   would only make those more cryptic, not less. */
const ERROR_CODES = {
  E01: {
    title: 'Upload preset has "Async" turned on',
    cause: 'The Cloudinary upload preset in use has Async delivery enabled, so Cloudinary accepts the file but never sends back a usable file URL.',
    fix: 'Cloudinary Dashboard → Settings → Upload → Upload presets → edit the preset → turn Async OFF → Save.'
  },
  E02: {
    title: 'Upload server unreachable',
    cause: 'The app could not reach Cloudinary at all — almost always a wrong cloud name/preset in the app config, or the device is offline.',
    fix: 'Check window.__CLOUDINARY_CLOUD_NAME and __CLOUDINARY_UPLOAD_PRESET near the top of index.html, and confirm there\'s a working connection.'
  },
  E03: {
    title: 'Unexpected upload response',
    cause: 'Cloudinary responded, but not with the shape the app expects — usually an HTML error/captive-portal page, or a connection that dropped mid-upload.',
    fix: 'Check the browser console right after the failure — the raw response snippet is logged alongside this error. Retry on a stronger connection.'
  },
  E99: {
    title: 'Unknown upload error',
    cause: 'An upload failed in a way that doesn\'t match a known cause above.',
    fix: 'Check the browser console for the full technical error logged alongside this code.'
  },
};
// Builds the message shown to whoever hit the failure. Coded errors (see
// ERROR_CODES above) get a short, stable, support-friendly line; anything
// else falls back to its own plain-English message, unchanged.
function uploadErrorMessage(e){
  const code = e && e.code;
  if(code && ERROR_CODES[code]){
    return `Upload failed (${code}) — if this keeps happening, message lexdendigital@gmail.com with this code and the time: ${new Date().toLocaleString()}.`;
  }
  return 'Upload failed — ' + ((e && e.message) || 'please try again.');
}
async function cloudinaryUploadFile(file, maxSizeMB){
  maxSizeMB = maxSizeMB || 25;
  if(file.size > maxSizeMB*1024*1024){
    throw new Error(`File too large — ${maxSizeMB}MB max`);
  }
  // Work out the file's extension and Cloudinary "resource_type" ourselves,
  // and generate our own public_id, BEFORE uploading. Why: when the upload
  // preset has "Async" turned on, Cloudinary's immediate response is just
  // {status:"pending", batch_id:...} — no url, no format, and (critically)
  // no public_id unless *we* send one ourselves. Without an explicit
  // public_id, a pending response gives the browser nothing to build a
  // delivery URL from, which is why uploads used to silently fail and
  // required copying the URL from the Cloudinary dashboard by hand.
  // Sending our own public_id means we always know exactly where the file
  // will live the instant the upload is accepted, Async or not.
  const origName = (file.name || 'upload').toLowerCase();
  const dotIdx = origName.lastIndexOf('.');
  const ext = dotIdx > -1 ? origName.slice(dotIdx+1).replace(/[^a-z0-9]/g,'') : '';
  const mime = file.type || '';
  let guessedResourceType = 'raw'; // pdfs/zips/docs etc. default here
  if(mime.startsWith('image/') || ext === 'pdf') guessedResourceType = 'image'; // Cloudinary treats PDFs as "image"
  else if(mime.startsWith('video/') || mime.startsWith('audio/')) guessedResourceType = 'video';
  const rand = `web_${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`;
  // Raw files (zip, docs, etc.) conventionally keep their extension baked
  // into the public_id itself in Cloudinary; image/video public_ids stay
  // extension-free and get ".ext" appended at delivery time instead.
  const generatedPublicId = (guessedResourceType === 'raw' && ext) ? `${rand}.${ext}` : rand;

  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', window.__CLOUDINARY_UPLOAD_PRESET);
  formData.append('public_id', generatedPublicId);
  let res;
  try{
    res = await fetch(`https://api.cloudinary.com/v1_1/${window.__CLOUDINARY_CLOUD_NAME}/auto/upload`, {
      method: 'POST',
      body: formData
    });
  }catch(networkErr){
    // fetch() itself throws on a network/CORS failure, before there's any
    // HTTP response to read — this is what happens if CLOUDINARY_CLOUD_NAME
    // is wrong (a typo'd cloud name 404s at the DNS/CORS layer) or the
    // device is offline, and it used to look identical to every other
    // failure. Callers can now tell them apart from the message alone.
    const err = new Error('Could not reach Cloudinary — check the cloud name/preset or your connection.');
    err.code = 'E02';
    throw err;
  }
  // Read the body ONCE as text first — res.json() consumes the stream, so
  // if it fails we'd otherwise have no way to see what actually came back.
  // Parsing text->JSON ourselves means a non-JSON response (HTML error
  // page, captive-portal page, a mobile carrier's data-compression proxy
  // rewriting the body, etc.) is visible instead of silently becoming
  // "no data" and falling into a vague error.
  let rawText = '';
  try{ rawText = await res.text(); }catch(readErr){ /* body unreadable — rawText stays '' */ }
  let data = null;
  try{ data = rawText ? JSON.parse(rawText) : null; }catch(parseErr){ /* not JSON — data stays null, rawText still has it */ }
  // A preset with "Async: true" makes Cloudinary return immediately with
  // {status:"pending", batch_id:...} instead of the finished file's
  // secure_url — the request succeeds (HTTP 200) but there's no URL in the
  // response. The base file is already stored and deliverable the instant
  // this response lands though ("Async" only defers *eager*/pre-generated
  // transformations, never the original asset) — so build the delivery URL
  // ourselves from the public_id, resource_type and extension we already
  // worked out before uploading, instead of treating this as a failure.
  if(res.ok && data && !data.secure_url && (data.status==='pending' || data.batch_id)){
    console.warn('Cloudinary preset has Async enabled — building delivery URL from the public_id generated client-side.');
    const rt = data.resource_type || guessedResourceType;
    const dtype = data.type || 'upload';
    const ver = data.version ? `v${data.version}/` : '';
    const extSuffix = (rt !== 'raw' && ext) ? `.${ext}` : '';
    data.secure_url = `https://res.cloudinary.com/${window.__CLOUDINARY_CLOUD_NAME}/${rt}/${dtype}/${ver}${generatedPublicId}${extSuffix}`;
  }
  if(!res.ok || !data || !data.secure_url){
    if(data && data.error && data.error.message){
      const err = new Error(data.error.message);
      err.code = 'E03';
      throw err;
    }
    // No usable error.message — this means the response was HTTP-ok-ish
    // but not the JSON shape Cloudinary normally sends. Log a snippet of
    // the actual body instead of a bare status code, since THIS is what
    // tells you whether it's an HTML page (network/proxy/captive-portal
    // interference), a truncated response (connection dropped mid-upload
    // on a weak connection), or something else entirely.
    const snippet = rawText ? rawText.replace(/\s+/g,' ').trim().slice(0,120) : '(empty response body)';
    console.warn(`Upload failed (HTTP ${res.status}) — server said: ${snippet}`);
    const err = new Error(`Upload failed (HTTP ${res.status}) — server said: ${snippet}`);
    err.code = 'E03';
    throw err;
  }
  return data.secure_url;
}

/* Admin media upload — lets the admin attach a file straight from their
   device instead of only pasting a URL. Uploads to Cloudinary (unsigned
   upload preset), then fills the matching URL field with the returned
   secure_url so everything downstream (gallery rendering, saveProduct,
   etc.) works exactly as it already did for pasted links. `prefix` is the
   shared id stem for a given media slot group — 'f_media' for the product
   form, 'fp_media' for feed posts — so this one function drives both:
   the URL input is #{prefix}{slotIndex} and its status text is
   #{prefix}FileStatus{slotIndex}. */
async function uploadMediaFile(prefix, slotIndex, inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const statusEl = $('#'+prefix+'FileStatus'+slotIndex);
  if(statusEl) statusEl.textContent = 'Uploading…';
  try{
    const url = await cloudinaryUploadFile(file);
    const urlInput = $('#'+prefix+slotIndex);
    if(urlInput) urlInput.value = url;
    if(statusEl) statusEl.textContent = '✅ Uploaded';
    toast('File uploaded', 'success');
  }catch(e){
    console.warn('Media upload failed', e);
    if(statusEl) statusEl.textContent = e.code ? `❌ Upload failed (${e.code})` : '❌ '+e.message;
    toast(uploadErrorMessage(e), 'error');
    inputEl.value = '';
  }
}
function productMedia(p){
  return (p.gallery||[]).map(normalizeMedia).filter(Boolean).slice(0,8);

/* Renders one media item — image, direct video, or a platform embed
   (YouTube/TikTok/Vimeo/Facebook/Instagram) — used for the main viewer
   and when a thumbnail is tapped. `big` = full player controls/autoplay. */
function mediaHtml(m, big){
  if(!m) return '';
  if(m.type==='embed') return `<div style="position:relative;width:100%;height:100%;background:#000;"><iframe src="${m.embed}" style="width:100%;height:100%;border:0;" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
  if(m.type==='video') return `<video src="${cldOptimize(m.url, 960)}" preload="metadata" ${big?'controls':'muted'} playsinline${big?' autoplay':''}></video>`;
  return `<img src="${cldOptimize(m.url, big?960:400)}" alt="" loading="lazy">`;
}

// Generic share helper backing the Share buttons on product and feed
// pages. navigator.share() hands off to the device's native share sheet —
// WhatsApp, Messages, Email, whatever the person picks — with the message
// text and link bundled together, which is what "send it to whoever I
// want" actually needs; a plain copied link can't carry a message with it.
// Falls back to copying "text + link" to the clipboard on browsers/desktops
// without share-sheet support (e.g. most desktop browsers).
//
// BUGFIX: this used to also attach the product/post image as a File when
// the share target supported it. Most share targets (WhatsApp included)
// then show that raw attached image INSTEAD of a link preview — which
// looks like a random photo landing in the chat with no card, no title,
// no description, nothing tappable. What the app actually wants is the
// rich link-preview card WhatsApp/etc. build themselves from this page's
// og:title/og:description/og:image tags the moment a real URL is present
// in the shared text — exactly what you get sharing the site's own link.
// So `imageUrl` is intentionally unused now; we always share {title, text,
// url} and let the target app generate that preview card.
async function shareContent(title, text, url, imageUrl){
  const shareData = { title, text, url };
  try{
    if(navigator.share && (!navigator.canShare || navigator.canShare(shareData))){
      await navigator.share(shareData);
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return; // person cancelled the share sheet — not an error
  }
  try{
    await navigator.clipboard.writeText(`${text}`);
    toast('Link copied — paste it anywhere to share','success');
  }catch(e){
    toast('Could not open share menu — copy the link from your address bar instead','error');
  }
}
// Best-effort: turns an image URL into a File the native share sheet can
// attach as a thumbnail. Cloudinary's delivery URLs are public/CORS-open so
// this normally succeeds, but it degrades to a text-only share (never a
// failure) if the fetch is blocked or the browser can't share files.
async function urlToShareFile(url, filename){
  if(!url) return null;
  try{
    const res = await fetch(url);
    if(!res.ok) return null;
    const blob = await res.blob();
    return new File([blob], filename || 'share.jpg', { type: blob.type || 'image/jpeg' });
  }catch(e){ return null; }
}
// First real paragraph of a feed post's body, trimmed to a reasonable
// share-message length — long-form posts shouldn't dump their entire body
// into a WhatsApp message.
function firstParagraph(text, maxLen){
  maxLen = maxLen || 220;
  const para = (text||'').split(/\n\s*\n/).map(s=>s.trim()).find(Boolean) || (text||'').trim();
  return para.length > maxLen ? para.slice(0, maxLen-1).trim()+'…' : para;
}
// Domain that generates a real per-item Open Graph preview (title,
// description, image) for shared links. GitHub Pages serves one static
// index.html to every URL, so a crawler hitting a raw #product/123 or
// #feed/123 hash link only ever sees the site's generic default tags —
// the hash isn't even sent to the server. Sharing through this domain's
// /product/:id and /feed/:id routes instead lets a serverless function
// look the item up and answer with its actual title/image before
// redirecting a real visitor's browser straight into the app.
const NOVA_LINKS_BASE = 'https://lexden-nova-links.vercel.app';
// WhatsApp, Telegram and most chat apps render *text* as bold in plain
// message text (there's no separate "bold" share field to set) — this
// wraps a title so it shows up bold wherever the message lands.
function boldForShare(text){ return `*${String(text||'').replace(/\*/g,'')}*`; }
function shareProduct(id){
  const p = findProduct(id);
  if(!p) return;
  const url = NOVA_LINKS_BASE + '/product/' + id;
  const message = `${boldForShare(p.name)} on ${DB.content.appName||'our store'} — ${priceLabel(p)}\n\nLearn more: ${url}`;
  // Local + shared aggregate counter — feeds trendingScore() below, same
  // pattern as views/wishlists/clicks. Counted on tap (consistent with how
  // trackProductClick counts a tap, not a confirmed downstream action),
  // since navigator.share()'s own promise doesn't reliably resolve/reject
  // the same way across every browser and share target.
  const counts = {...DB.productShareCounts};
  counts[id] = (counts[id]||0) + 1;
  DB.productShareCounts = counts;
  pushProductShareCountToCloud(id);
  shareContent(p.name, message, url, p.image ? cldOptimize(p.image, 800) : null);
}
function shareFeedPost(id){
  const p = DB.feed.find(x=>x.id===id);
  if(!p) return;
  const url = NOVA_LINKS_BASE + '/feed/' + id;
  // Per spec: title (bold), then the first paragraph of the body, then
  // "Learn more: <link>" — and the first image (not just any image) as
  // the attached thumbnail.
  const message = `${boldForShare(p.title)}\n\n${firstParagraph(p.body)}\n\nLearn more: ${url}`;
  const firstImage = (p.media||[]).find(m=>m.type!=='video');
  const counts = {...DB.feedShareCounts};
  counts[id] = (counts[id]||0) + 1;
  DB.feedShareCounts = counts;
  pushFeedShareCountToCloud(id);
  shareContent(p.title, message, url, firstImage ? cldOptimize(firstImage.url, 800) : null);
}

function isPostLiked(id){ return DB.likedPosts.includes(id); }
function likeCountFor(id){ return DB.feedLikeCounts[id] || 0; }
// Instagram/TikTok-style: the exact number stays hidden on a post until it
// has some real momentum, so a brand-new post never LOOKS unpopular next to
// one with hundreds of likes. Below the threshold, only the heart shows.
const LIKE_COUNT_THRESHOLD = 1;
function formatLikeCount(n){
  if(n >= 1000000) return (n/1000000).toFixed(n%1000000===0?0:1)+'m';
  if(n >= 1000) return (n/1000).toFixed(n%1000===0?0:1)+'k';
  return String(n);
}
// A guest tapping the heart never gets silently ignored or just dropped
// into a generic sign-in wall — their intent (which post they wanted to
// like) is remembered here and finished automatically the moment sign-in
// or sign-up succeeds (see applyPendingFeedLikeIfAny(), called from every
// auth-success path), so the like actually lands without the person having
// to remember to come back and tap the heart again.
window.__pendingFeedLikeId = null;
function toggleFeedLike(id){
  if(!window.__fbShopper){
    window.__pendingFeedLikeId = id;
    showSignInPromptModal('Sign in to like posts — we\'ll add your like the moment you\'re in.');
    return;
  }
  applyFeedLikeToggle(id);
}
function applyFeedLikeToggle(id){
  const wasLiked = isPostLiked(id);
  const counts = {...DB.feedLikeCounts};
  const current = counts[id] || 0;
  if(wasLiked){
    DB.likedPosts = DB.likedPosts.filter(x=>x!==id);
    counts[id] = Math.max(0, current - 1);
  } else {
    DB.likedPosts = [...DB.likedPosts, id];
    counts[id] = current + 1;
  }
  DB.feedLikeCounts = counts;
  rerenderFeedLikeButtons(id);
  pushLikedPostsToCloud();
  pushFeedLikeCountToCloud(id, wasLiked ? -1 : 1);
}
// Called right after every sign-in/sign-up success path sets window.__fbShopper.
// Returns true (and jumps straight to the liked post so the person can see
// it land) if there was a pending like to finish; the caller should only
// fall back to its normal navigate('#profile') when this returns false.
function applyPendingFeedLikeIfAny(){
  const id = window.__pendingFeedLikeId;
  if(!id) return false;
  window.__pendingFeedLikeId = null;
  if(!isPostLiked(id)) applyFeedLikeToggle(id);
  navigate('#feed/'+id);
  return true;
}
// Every place a like button can appear for the same post (detail page,
// hero card, grid card) gets updated in place so counts never drift out of
// sync between screens without a full re-render.
function rerenderFeedLikeButtons(id){
  document.querySelectorAll(`[data-like-id="${id}"]`).forEach(el=>{
    el.outerHTML = feedLikeButtonHtml(id);
  });
}
// Uses a thumbs-up (not the wishlist heart) so a shopper glancing at a feed
// post never confuses "like this post" with "add this product to my
// wishlist" — those are two different actions in two different places that
// used to share one icon. Only called with small=true (icon-only, no label)
// from the feed detail page's Like button now — the icon-only overlay
// version used to also sit on preview cards (home hero row, home "From the
// feed" grid, full feed list rows) but was removed from all three per
// request; small stays supported so the detail-page call site is unaffected.
function feedLikeButtonHtml(id, small){
  const liked = isPostLiked(id);
  const count = likeCountFor(id);
  const showCount = count >= LIKE_COUNT_THRESHOLD;
  const showLabel = !small;
  const expand = showCount || showLabel;
  return `<button class="wish-btn ${liked?'active':''}" data-like-id="${id}" onclick="event.stopPropagation(); toggleFeedLike('${id}')" style="position:static;background:var(--card);display:inline-flex;align-items:center;gap:5px;${expand?'width:auto;border-radius:16px;padding:6px 12px;':(small?'width:28px;height:28px;padding:0;border-radius:50%;':'width:32px;height:32px;padding:0;border-radius:50%;')}" aria-label="Like">
    ${icon(liked?'thumbUpFill':'thumbUp')}${showLabel?`<span class="small" style="line-height:1;font-weight:600;">Like</span>`:''}${showCount?`<span class="small" style="line-height:1;">${formatLikeCount(count)}</span>`:''}
  </button>`;
}
// Own Firestore collections, kept separate from the admin-only catalog/*
// docs — the same reasoning as /reviews: any shopper needs to be able to
// write here, not just the admin, so it can't live inside catalog/settings.
// "likedPosts/{uid}" mirrors "wishlists/{uid}" exactly (per-shopper doc,
// owner-writable). "feedLikes/{postId}" holds the shared running count,
// updated with increment() so concurrent likes from different shoppers
// can't clobber each other. Both fail silently (console.warn only) if the
// matching security rule hasn't been added yet, exactly like pushWishlistToCloud —
// a like button not syncing to the cloud yet should never break the UI.
async function pushLikedPostsToCloud(){
  if(!window.__fb || !window.__fbUid) return;
  const { fbDb, doc, setDoc } = window.__fb;
  try{
    await setDoc(doc(fbDb, "likedPosts", window.__fbUid), { ids: DB.likedPosts });
  }catch(e){ console.warn("Liked-posts push failed", e); /* non-critical, no toast */ }
}
// FIX (v2.0.2 — "likes disappearing"): the old updateDoc()+setDoc-fallback
// pattern assumed ANY updateDoc failure meant "doc doesn't exist yet" and
// reacted by overwriting the whole document with just this one delta — but
// updateDoc can also fail on a transient network blip, a dropped connection,
// or any other transient Firestore error while the doc very much still
// exists with its real accumulated count. When that happened, the fallback
// silently replaced the whole document with just the current click's delta
// (clamped to 0 if negative), wiping out every previous like. A single
// setDoc(..., {merge:true}) with increment() does the same "create if
// missing, increment if present" job atomically in one call, with no
// failure path that can ever nuke existing counts.
async function pushFeedLikeCountToCloud(postId, delta){
  if(!window.__fb) return;
  const { fbDb, doc, setDoc, increment } = window.__fb;
  try{
    await setDoc(doc(fbDb, "feedLikes", postId), { count: increment(delta) }, { merge: true });
  }catch(e){ console.warn("Feed-like count push failed", e); /* non-critical, no toast */ }
}
async function pullFeedLikesFromCloud(){
  if(!window.__fb) return;
  const { fbDb, collection, getDocs, doc, getDoc } = window.__fb;
  try{
    const snap = await getDocs(collection(fbDb, "feedLikes"));
    const counts = {};
    snap.forEach(d=>{ counts[d.id] = (d.data()||{}).count || 0; });
    DB.feedLikeCounts = counts;
  }catch(e){ console.warn("Feed-like counts pull failed", e); }
  if(window.__fbUid){
    try{
      const likedSnap = await getDoc(doc(fbDb, "likedPosts", window.__fbUid));
      const cloudIds = likedSnap.exists() ? (likedSnap.data().ids||[]) : [];
      // Same merge-not-overwrite approach as the wishlist pull — anything
      // liked on this device as a guest right before signing in survives.
      const merged = Array.from(new Set([...(DB.likedPosts||[]), ...cloudIds]));
      DB.likedPosts = merged;
      if(merged.length !== cloudIds.length) pushLikedPostsToCloud();
    }catch(e){ console.warn("Liked-posts pull failed", e); }
  }
}
// "feedViews/{postId}" — same shared-counter pattern as feedLikes/productViews.

  const { fbDb, doc, setDoc, increment } = window.__fb;
  try{ await setDoc(doc(fbDb, "feedViews", id), { count: increment(1) }, { merge: true }); }
  catch(e){ console.warn("Feed view push failed", e); }
}

}
// Called once per genuine navigation to a product page (see render()) —
// logs locally (feeds shopperProfile()'s recent-activity view) and bumps
// the shared cloud counter (feeds dynamic Trending everywhere else).
function trackProductView(id){
  const p = findProduct(id);
  if(!p) return;
  logActivity('User', `Viewed product ${p.name}`);
  const counts = {...DB.productViewCounts};
  counts[id] = (counts[id]||0) + 1;
  DB.productViewCounts = counts;
  pushProductViewToCloud(id);
}
// Sums the like-counts of every feed post that links to this product
// (post.productIds — see feedPostProductIds), using data the feed already
// tracks in DB.feedLikeCounts.
function feedLikesForProduct(id){
  return DB.feed.filter(post=>feedPostProductIds(post).includes(id)).reduce((sum,post)=>sum+(DB.feedLikeCounts[post.id]||0), 0);
}
// A feed post can now be tagged to MULTIPLE products (admin can select
// several when creating/editing a post). Reads the new productIds array
// when present, and falls back to the old single productId field for any
// post saved before this change — so existing feed posts already in
// Firestore keep working without a data migration.
function feedPostProductIds(post){
  if(!post) return [];
  if(Array.isArray(post.productIds) && post.productIds.length) return post.productIds;
  return post.productId ? [post.productId] : [];
}
// The actual "dynamic trending" score: real cross-shopper signals only
// (views + wishlist adds + feed likes on linked posts + clicks + shares),
// weighted toward higher-intent actions since a wishlist add, a share, or
// a like says a lot more than a page view. Products with zero signal
// simply score 0 — no fabricated numbers.
function trendingScore(p){
  const views = DB.productViewCounts[p.id]||0;
  const wishlists = DB.productWishlistCounts[p.id]||0;
  const likes = feedLikesForProduct(p.id);
  const clicks = DB.productClickCounts[p.id]||0;
  const shares = DB.productShareCounts[p.id]||0;
  // Weights: a share is the single strongest signal (someone chose to put
  // their own name behind recommending it to someone else) → 4. A wishlist
  // add is a close second (real purchase intent) → 3. A click-through from
  // a card is a genuine "I wanted to know more" → 2, same tier as a feed
  // like. A view is the weakest, lowest-intent signal → 1.
  return views*1 + wishlists*3 + likes*2 + clicks*2 + shares*4;
}
// Returns the live-computed trending list. Ranks by real signal first;
// once enough products have accumulated activity to fill the list this
// entirely replaces the old static trending:true admin flag. Until then
// (cold start / a fresh install with no traffic yet), it backfills with
// admin-flagged trending products, then top-rated, so the section is never
// empty or arbitrary while data is still accumulating.
function computeTrendingProducts(products, limit){
  limit = limit || 6;
  const scored = products.map(p=>({p, score:trendingScore(p)})).filter(x=>x.score>0);
  scored.sort((a,b)=>b.score-a.score);
  const result = scored.map(x=>x.p);
  if(result.length < limit){
    const have = new Set(result.map(p=>p.id));
    const backfill = products.filter(p=>p.trending && !have.has(p.id));
    backfill.forEach(p=>{ if(result.length<limit){ result.push(p); have.add(p.id); } });
  }
  if(result.length < limit){
    const have = new Set(result.map(p=>p.id));
    products.slice().sort((a,b)=>b.rating-a.rating).forEach(p=>{ if(result.length<limit && !have.has(p.id)){ result.push(p); have.add(p.id); } });
  }
  return result.slice(0,limit);
}
// "Featured for You" — personalizes the admin's featured:true picks using
// shopperProfile()'s inferred topCategory/wishlist interest, so a returning
// shopper sees featured items relevant to them first instead of the same
// fixed list every visitor gets. Falls back to the plain admin-featured
// order for a first-time visitor with no inferred interest yet — this never
// shows something un-featured, it only re-sorts what the admin already chose.
function computeFeaturedForYou(products, sp, limit){
  limit = limit || 8;
  const featured = products.filter(p=>p.featured);
  if(!sp || !sp.topCategory) return featured.slice(0,limit);
  const inCategory = featured.filter(p=>p.category===sp.topCategory);
  const rest = featured.filter(p=>p.category!==sp.topCategory);
  return [...inCategory, ...rest].slice(0,limit);
}
// RELATED PRODUCTS — replaces the old "same category, first 6" list with a
// real weighted-similarity score, so "related" actually means "reads like
// the same kind of thing", not just "happens to share a category dropdown
// value". Signals, each 0-1 before weighting:
//   • tag/text overlap (overlapScore over name+description+tags) — the
//     "read and understand what this product is about" piece
//   • same category (still worth a lot — it's a real signal, just not the
//     only one anymore)
//   • price proximity (a $12 template isn't "related" to a $400 bundle
//     just because both are templates)
//   • rating (mild boost — don't surface a 2★ item just because the text
//     matches; global quality still matters)
//   • a shopper-history nudge when their topCategory (see shopperProfile)
//     matches, so returning shoppers get a small personalized boost —
//     this is the "(i) user's own data" half of the algorithm, alongside
//     the global text/price/category signal that applies to everyone.
function computeRelatedProducts(anchor, allProducts, opts){
  opts = opts || {};
  const limit = opts.limit || 6;
  const sp = opts.shopperProfile || null;
  const pool = allProducts.filter(p=>p.id!==anchor.id && p.status!=='draft');
  if(!pool.length) return [];
  const textOf = p => `${p.name} ${p.description||''} ${(p.tags||[]).join(' ')}`;
  const anchorTokens = tokenize(textOf(anchor));
  const allTokenSets = pool.map(p=>tokenize(textOf(p)));
  const corpusFreq = buildCorpusFreq([anchorTokens, ...allTokenSets]);
  const maxPriceDelta = Math.max(...pool.map(p=>Math.abs((p.salePrice||p.price||0) - (anchor.salePrice||anchor.price||0))), 1);
  const scored = pool.map((p, i) => {
    const textScore = overlapScore(anchorTokens, allTokenSets[i], corpusFreq); // 0..~1.5
    const categoryScore = p.category === anchor.category ? 1 : 0;
    const priceDelta = Math.abs((p.salePrice||p.price||0) - (anchor.salePrice||anchor.price||0));
    const priceScore = 1 - Math.min(1, priceDelta / maxPriceDelta); // closer price = higher
    const ratingScore = (p.rating||0) / 5;
    const personalBoost = (sp && sp.topCategory && p.category === sp.topCategory) ? 0.15 : 0;
    const score = textScore*2.2 + categoryScore*1.3 + priceScore*0.5 + ratingScore*0.35 + personalBoost;
    return { p, score };
  }).filter(x => x.score > 0);
  scored.sort((a,b) => b.score - a.score);
  let result = scored.map(x=>x.p);
  // Cold-start / thin-catalog fallback: if similarity scoring came up
  // short (e.g. a brand-new product with a sparse description), backfill
  // with same-category items so the section is never empty, same
  // philosophy as computeTrendingProducts' backfill tiers.
  if(result.length < limit){
    const have = new Set(result.map(p=>p.id));
    pool.filter(p=>p.category===anchor.category && !have.has(p.id))
      .sort((a,b)=>b.rating-a.rating)
      .forEach(p=>{ if(result.length<limit){ result.push(p); have.add(p.id); } });
  }
  return result.slice(0, limit);
}
// RELATED FEED POSTS — the feed-post equivalent: "reading and understanding
// what this post is about, compared to every other post" via the same
// overlapScore engine (title+body, since posts don't have tags), with a
// popularity tiebreak (likes+views) so that among near-equal text matches,
// the one other shoppers actually engaged with globally wins.
function relatedFeedPosts(anchor, limit){
  limit = limit || 4;
  const pool = DB.feed.filter(p=>p.id!==anchor.id);
  if(!pool.length) return [];
  const textOf = p => `${p.title} ${p.body||''}`;
  const anchorTokens = tokenize(textOf(anchor));
  const allTokenSets = pool.map(p=>tokenize(textOf(p)));
  const corpusFreq = buildCorpusFreq([anchorTokens, ...allTokenSets]);
  const scored = pool.map((p,i)=>{
    const textScore = overlapScore(anchorTokens, allTokenSets[i], corpusFreq);
    const anchorIds = feedPostProductIds(anchor);
    const sameProduct = anchorIds.some(id=>feedPostProductIds(p).includes(id)) ? 0.4 : 0;
    const engagement = (DB.feedLikeCounts[p.id]||0) + (DB.feedViewCounts[p.id]||0)*0.33;
    const popularityScore = Math.min(0.3, Math.log2(engagement+1) * 0.06); // small tiebreak, never dominates topic match
    return { p, score: textScore + sameProduct + popularityScore };
  }).filter(x=>x.score > 0.05); // require a real topical connection, not just noise
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,limit).map(x=>x.p);
}

// FEED RANKING — a real "hot" score instead of showing posts in raw
// creation order forever. Same idea as Hacker News/Reddit "hot" ranking:
// engagement (likes) matters, but decays with age so a well-liked post
// from months ago doesn't permanently bury everything newer. A brand-new
// post with zero likes yet still starts with a small positive score (the
// "+1" below) so it's never literally invisible before its first like.
const FEED_RANK_GRAVITY = 1.6; // higher = faster decay, favors recency more
function feedHotScore(post){
  const likes = DB.feedLikeCounts[post.id] || 0;
  // Views (see trackFeedView) are a weaker signal than a like — someone
  // opening a post is lower-intent than choosing to like it — but a post
  // getting read heavily with no likes yet was previously invisible to
  // ranking entirely. Weighting it at 1/3 a like lets real read-traffic
  // move a fresh post up before it earns its first like. A share is the
  // strongest signal here too — weighted above a like, same reasoning as
  // trendingScore above.
  const views = DB.feedViewCounts[post.id] || 0;
  const shares = DB.feedShareCounts[post.id] || 0;
  const ageHours = Math.max(0, (Date.now() - new Date(post.date||0).getTime()) / 36e5);
  return (likes + views*0.33 + shares*1.5 + 1) / Math.pow(ageHours + 2, FEED_RANK_GRAVITY);
}
// ---- CONTENT SIMILARITY ENGINE ---------------------------------------
// Shared by computeRelatedProducts() and relatedFeedPosts() below. Since
// this is a static single-file app with no server-side embeddings model,
// "reading and understanding" a feed post/product to find related ones is
// implemented honestly as lightweight lexical similarity — tokenize both
// texts, drop short/common filler words, and score by how much vocabulary
// they share (a bounded Jaccard-style overlap) — rather than pretending to
// run real NLP client-side. This is the same class of technique real
// "related articles" widgets used before embeddings were cheap, and it
// works well here because titles/descriptions/tags are short and topical.
const STOPWORDS = new Set(['the','a','an','and','or','but','for','with','from','this','that','these','those','into','onto','your','you','our','ours','are','was','were','been','has','have','had','not','all','any','can','will','would','should','about','after','before','over','under','than','then','them','they','their','its','it\'s','of','to','in','on','at','is','be','as','by','we','us','i','if','so','how','what','why','when','which']);
function tokenize(str){
  return (str||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2 && !STOPWORDS.has(w));
}
// Bag-of-words overlap score between two token arrays: counts how many of
// the *rarer, more specific* shared words appear in both (weighted by
// inverse frequency in `corpusFreq` so a word every post shares, like a
// brand name, counts far less than a word only a few posts share), then
// normalizes by the shorter document's length so a short post isn't
// unfairly penalized against a long one.
function overlapScore(tokensA, tokensB, corpusFreq){
  if(!tokensA.length || !tokensB.length) return 0;
  const setB = new Set(tokensB);
  let score = 0;
  const seen = new Set();
  tokensA.forEach(w=>{
    if(setB.has(w) && !seen.has(w)){
      seen.add(w);
      const freq = corpusFreq[w] || 1;
      score += 1 / Math.log2(freq + 2); // rarer shared word = more weight
    }
  });
  return score / Math.min(tokensA.length, tokensB.length || 1, 12);
}
// Word document-frequency across a corpus of token arrays, used to weight
// overlapScore — computed fresh each call since the catalog/feed is small
// enough (dozens to low hundreds of items) that this is cheap, and it
// keeps the weighting accurate as products/posts are added or removed.
function buildCorpusFreq(tokenArrays){
  const freq = {};
  tokenArrays.forEach(tokens=>{
    new Set(tokens).forEach(w=>{ freq[w] = (freq[w]||0) + 1; });
  });
  return freq;
}
// Ranks every feed post (important + regular together) by feedHotScore,
// admin-pinned "important" posts first (they're meant to act like a
// featured banner, not compete on age/likes), then the rest by hot score.
// This is what both the Home "From the feed" preview and the full "More
// feed" list screen use, so the ordering is consistent everywhere.
function rankedFeed(){
  const posts = DB.feed.slice();
  const important = posts.filter(p=>p.important);
  const regular = posts.filter(p=>!p.important).sort((a,b)=>feedHotScore(b)-feedHotScore(a));
  return [...important, ...regular];
}

// ---- Generic custom dropdown ----
// Replaces every remaining native <select> in the app (sort pills, admin
// form pickers, currency, rating, etc) with the same in-page .csel widget
// the sign-up wizard already uses below, so no OS/browser picker sheet
// ever opens anywhere in the app — every dropdown is styled, positioned,
// and themed the same way as the rest of the UI.
//
// A rendered instance registers its optional onPick side-effect (a real
// JS function reference, not a re-serialized string) in cselRegistry,
// keyed by id. Picking an option updates that element's DOM directly
// (button label + active option) rather than triggering a full render(),
// so a dropdown sitting inside an otherwise-uncontrolled form (e.g. the
// admin product editor) doesn't wipe out whatever the admin has already
// typed into the other fields — that matches exactly how the native
// <select onchange> it replaces used to behave. A same-id hidden <input>
// keeps the value available to every existing `$('#id').value` read site
// (form submit handlers) with zero changes needed there.
// Pass sm:true for the compact pill-sized variant (sort/currency pickers
// that sit beside other pill buttons) instead of the full-width form one.
const cselRegistry = {};
function customSelect(id, value, options, placeholder, onPick, sm){
  const norm = options.map(o=>typeof o==='string'?{value:o,label:o}:o);
  cselRegistry[id] = { onPick: onPick||null };
  const sel = norm.find(o=>String(o.value)===String(value));
  return `
  <input type="hidden" id="${id}" value="${escapeHtml(value==null?'':value)}">
  <div class="csel ${sm?'csel-sm':''}" id="csel_${id}">
    <button type="button" class="csel-btn ${sel?'':'placeholder'}" onclick="event.stopPropagation();toggleCustomSelect('${id}')">
      <span>${escapeHtml(sel?sel.label:(placeholder||''))}</span><span class="csel-arrow">▾</span>
    </button>
    <div class="csel-panel">
      ${norm.map(o=>`<div class="csel-opt ${String(o.value)===String(value)?'active':''}" onclick="pickCustomSelect('${id}','${jsStr(o.value)}',this)">${escapeHtml(o.label)}</div>`).join('')}
    </div>
  </div>`;
}
function toggleCustomSelect(id){
  const el = $('#csel_'+id);
  if(!el) return;
  const wasOpen = el.classList.contains('open');
  $all('.csel.open').forEach(o=>o.classList.remove('open'));
  if(!wasOpen) el.classList.add('open');
}
function pickCustomSelect(id, value, optEl){
  const hidden = $('#'+id);
  if(hidden) hidden.value = value;
  const wrap = $('#csel_'+id);
  if(wrap){
    const labelEl = wrap.querySelector('.csel-btn span');
    if(labelEl && optEl) labelEl.textContent = optEl.textContent;

async function handleGoogleSignIn(){
  if(!window.__signInWithGoogle){ toast('Sign-in is not ready yet — try again in a moment.', 'error'); return; }
  try{
    const user = await window.__signInWithGoogle();
    // A null result means signInWithRedirect kicked in — the page is
    // about to navigate away to Google and back, so there's nothing more
    // to do here; the sign-in itself gets picked up on reload.
    if(!user) return;
    // Build the shopper profile straight from the Google user object
    // instead of waiting on onAuthStateChanged (which sets this too, but
    // fires async and isn't guaranteed to land before we render) — this
    // is what makes the very first paint of the Profile tab already show
    // the right name/email/photo instead of a stale "Guest" flash.
    // onAuthStateChanged still runs afterward and fills in
    // address/occupation from Firestore once that fetch completes.
    window.__fbShopper = { uid:user.uid, name:user.displayName||'', email:user.email||'', photoURL:user.photoURL||'', provider:'google' };
    toast('Signed in!', 'success');
    if(!applyPendingFeedLikeIfAny()) navigate('#profile');
    render();
  }catch(e){
    console.warn('Google sign-in failed', e);
    const code = e && e.code;
    if(code==='auth/popup-closed-by-user' || code==='auth/cancelled-popup-request'){
      // Person closed the popup themselves — no need to scold them with
      // an error toast for that. (Note: some browsers' cross-origin-
      // isolation headers can make Firebase misreport a popup as "closed"
      // even when it wasn't — if Google sign-in seems to silently do
      // nothing rather than show this specific case, that's the likely
      // cause; see the code comment on __signInWithGoogle.)
      return;
    }
    // BUGFIX: this used to show the exact same "Google sign-in was
    // cancelled or failed" message for every single failure reason,
    // which is why it kept showing even when nothing was actually
    // cancelled — there was no way to tell what really went wrong. Now
    // only truly unrecognized codes fall through to a generic message,
    // and even then the real code/message is included so it's actionable
    // instead of a dead end.
    toast(
      (code==='auth/unauthorized-domain') ? 'This site isn\'t authorized for Google sign-in yet — the domain needs to be added in Firebase Console → Authentication → Settings → Authorized domains.'
      : (code==='auth/operation-not-allowed') ? 'Google sign-in isn\'t enabled for this app yet — enable it in Firebase Console → Authentication → Sign-in method.'
      : (code==='auth/network-request-failed') ? 'Network problem — check your connection and try again.'
      : (code==='auth/internal-error') ? 'Google sign-in was blocked — this often happens when the browser blocks third-party cookies/popups. Try allowing pop-ups and cookies for this site.'
      : (code==='auth/web-storage-unsupported') ? 'This browser has cookies/storage disabled, which Google sign-in needs. Enable cookies and try again.'
      : `Google sign-in failed: ${code || (e && e.message) || 'unknown error'}.`,
      'error'
    );
  }
}

      <div class="flex gap-8" style="margin-top:6px;">
        <button class="btn btn-outline" style="flex:1;" onclick="closeForgotPasswordModal()">Cancel</button>

function closeForgotPasswordModal(){ $('#forgotPasswordOverlay')?.remove(); }
async function submitForgotPassword(){

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ if(errEl) errEl.textContent = 'Enter a valid email address.'; return; }
  if(errEl) errEl.textContent = '';
  const btn = $('#forgotPassBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Sending…'; }
  try{
    if(!window.__sendPasswordReset) throw new Error('Not ready yet — try again in a moment.');
    await withTimeout(window.__sendPasswordReset(email), 15000, 'That took too long — check your connection and try again.');
    closeForgotPasswordModal();
    toast(`Password reset email sent to ${email} — check your inbox (and spam folder).`, 'success');
  }catch(e){
    console.warn('Password reset failed', e);
    const code = e && e.code;
    if(errEl) errEl.textContent =
      (code==='auth/invalid-email') ? 'That email address looks invalid.'
      : (code==='auth/network-request-failed') ? 'Network problem — check your connection and try again.'

      // reassuring message.

      // visibly distinguish this case from a real account.

    }
  }
}

async function sendSignupOtp(){

      window.__emailSignUp(signupWizard.email, signupWizard.password, fullName),

        country: signupWizard.country, state: signupWizard.state, howHeard: signupWizard.howHeard,
        provider: 'password',

        occupation: finalOccupation, gender: signupWizard.gender, dob: signupWizard.dob,

        provider: 'password',
      }).catch(e2=>{

      });
    });
    if(signupWizard.country && SIGNUP_COUNTRY_CURRENCY[signupWizard.country]){

/* ---- custom dropdown used by the wizard's picker fields (gender,

function wizardDropdown(field, options, placeholder){
  const val = signupWizard[field];
  const norm = options.map(o => typeof o === 'string' ? {value:o, label:o} : o);
  const sel = norm.find(o=>o.value===val);
  return `
  <div class="csel" id="csel_${field}">
    <button type="button" class="csel-btn ${sel?'':'placeholder'}" onclick="toggleWizardSelect('${field}')">
      <span>${escapeHtml(sel?sel.label:placeholder)}</span><span class="csel-arrow">▾</span>
    </button>
    <div class="csel-panel">
      ${norm.map(o=>`<div class="csel-opt ${o.value===val?'active':''}" onclick="pickWizardOption('${field}','${jsStr(o.value)}')">${escapeHtml(o.label)}</div>`).join('')}
    </div>
  </div>`;
}
function toggleWizardSelect(field){
  const el = $('#csel_'+field);
  if(!el) return;
  const wasOpen = el.classList.contains('open');
  $all('.csel.open').forEach(o=>o.classList.remove('open'));
  if(!wasOpen) el.classList.add('open');

// Uploads the chosen profile picture immediately (rather than waiting
// until final submit) so the wizard can show real upload progress and — as
// requested — keep the step's Continue button disabled ("not glow") until
// the photo has actually finished uploading, instead of letting someone
// move on while it's silently still in flight or has failed.
function previewSignupAvatar(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(file.size > 8*1024*1024){ toast('Image too large — 8MB max', 'error'); inputEl.value=''; return; }
  const reader = new FileReader();
  reader.onload = e=>{
    signupWizard.avatarFile = file;
    signupWizard.avatarPreview = e.target.result;
    signupWizard.photoURL = '';
    signupWizard.avatarUploadError = '';
    uploadSignupAvatar(file);
  };
  reader.readAsDataURL(file);
}
async function uploadSignupAvatar(file){
  signupWizard.avatarUploading = true;
  signupWizard.avatarUploadError = '';
  rerenderSignup();
  try{
    const upFile = await resizeAvatarImage(file);
    const url = await withTimeout(cloudinaryUploadFile(upFile, 8), 45000, 'Photo upload is taking too long — try again with a stronger connection.');
    // Guard against a since-superseded selection (picked a different photo,
    // or removed it) while this upload was in flight.
    if(signupWizard.avatarFile !== file) return;
    signupWizard.photoURL = url;
    signupWizard.avatarUploading = false;
    rerenderSignup();
  }catch(err){
    console.warn('Avatar upload failed', err);
    if(signupWizard.avatarFile !== file) return;
    signupWizard.avatarUploading = false;
    signupWizard.avatarUploadError = uploadErrorMessage(err);
    rerenderSignup();
  }
}
function retrySignupAvatarUpload(){
  if(signupWizard.avatarFile) uploadSignupAvatar(signupWizard.avatarFile);
}
function clearSignupAvatar(){
  signupWizard.avatarFile = null;
