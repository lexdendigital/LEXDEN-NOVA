<style>
:root{
  --navy:#0a1128; --navy-2:#121a3d; --gold:#d4af37; --gold-2:#f0d878;
  --cyber:#00d4ff; --ink:#eef1fb; --ink-dim:#9aa3c7; --danger:#ff5c73;
  --ok:#2ee6a6; --radius:16px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--navy);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;
  padding-bottom:calc(78px + var(--safe-b));}
.hide{display:none !important;}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:14px 16px;background:linear-gradient(180deg,var(--navy) 70%,transparent);
  backdrop-filter:blur(6px);}
.topbar .brand{font-weight:800;letter-spacing:.5px;font-size:15px;}
.topbar .brand b{color:var(--gold);}
.topbar .spacer{flex:1;}
.pill{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.14);color:var(--ink-dim);}
.pill.active{border-color:var(--ok);color:var(--ok);}
.pill.pending{border-color:var(--gold);color:var(--gold);}

.screen{padding:6px 16px 24px;animation:fadeUp .28s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card{background:linear-gradient(160deg,var(--navy-2),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.card h3{margin:0 0 4px;font-size:14px;color:var(--ink-dim);font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
.card .big{font-size:26px;font-weight:800;margin-top:4px;}
.card .big small{font-size:13px;color:var(--ink-dim);font-weight:500;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px 18px;border-radius:14px;border:none;font-weight:700;
  font-size:15px;cursor:pointer;position:relative;overflow:hidden;}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#1a1400;}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--ink);}
.btn-cyber{background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.4);color:var(--cyber);}
.btn-sm{padding:10px 14px;font-size:13px;width:auto;}
.btn:disabled{opacity:.45;pointer-events:none;}
.btn .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);
  transform:scale(0);animation:ripple .5s linear;pointer-events:none;}
@keyframes ripple{to{transform:scale(3);opacity:0;}}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:12px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:var(--ink);
  font-size:15px;outline:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);}
.hint{font-size:11.5px;color:var(--ink-dim);margin-top:6px;}
.err{font-size:12.5px;color:var(--danger);margin-top:6px;}
.ok-msg{font-size:12.5px;color:var(--ok);margin-top:6px;}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:520px;margin:0 auto;
  display:flex;background:rgba(10,17,40,.92);backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.08);padding:6px 2px calc(6px + var(--safe-b));
  overflow-x:auto;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 1px;border-radius:10px;color:var(--ink-dim);font-size:9.5px;font-weight:600;min-width:52px;}
.tab.active{color:var(--gold);}
.tab svg{width:18px;height:18px;}

.link-row{background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;margin-bottom:10px;}
.link-row .top-row{display:flex;align-items:center;gap:10px;}
.link-row .meta{flex:1;min-width:0;}
.link-row .pname{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.link-row .purl{font-size:11px;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.link-row .stats-row{display:flex;gap:14px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);}
.link-row .stat{font-size:11px;color:var(--ink-dim);}
.link-row .stat b{color:var(--ink);font-size:13px;display:block;}
.icon-btn{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);}

.txn{display:flex;justify-content:space-between;align-items:center;padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.06);}
.txn:last-child{border-bottom:none;}
.txn .l small{display:block;color:var(--ink-dim);font-size:11px;margin-top:2px;}
.status-chip{font-size:10.5px;padding:3px 9px;border-radius:999px;font-weight:700;}
.status-pending{background:rgba(212,175,55,.15);color:var(--gold);}
.status-available{background:rgba(46,230,166,.15);color:var(--ok);}
.status-approved{background:rgba(0,212,255,.15);color:var(--cyber);}
.status-paid{background:rgba(46,230,166,.15);color:var(--ok);}
.status-rejected{background:rgba(255,92,115,.15);color:var(--danger);}

.invite{border-radius:var(--radius);padding:18px;background:linear-gradient(135deg,rgba(0,212,255,.12),rgba(212,175,55,.10));
  border:1px solid rgba(255,255,255,.1);margin-bottom:14px;}
.invite .row{display:flex;gap:10px;margin-top:12px;}
.invite .row .btn{padding:12px;font-size:13.5px;}

.loader{display:flex;align-items:center;justify-content:center;min-height:70vh;flex-direction:column;gap:14px;}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);
  border-top-color:var(--gold);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);
  background:#1a2450;border:1px solid rgba(255,255,255,.14);padding:11px 18px;border-radius:999px;
  font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

/* leaderboard */
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.lb-row:last-child{border-bottom:none;}
.lb-rank{width:26px;text-align:center;font-weight:800;color:var(--ink-dim);}
.lb-rank.top1{color:var(--gold);} .lb-rank.top2{color:#d0d0d0;} .lb-rank.top3{color:#cd7f32;}
.lb-row.me{background:rgba(212,175,55,.08);border-radius:10px;padding:10px 8px;}
.lb-name{flex:1;font-weight:700;font-size:13.5px;}
.lb-amt{font-weight:800;font-size:13.5px;}

/* assistant chat */
.chat-log{display:flex;flex-direction:column;gap:10px;min-height:200px;max-height:52vh;overflow-y:auto;margin-bottom:12px;}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.45;}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#1a1400;border-bottom-right-radius:4px;}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-bottom-left-radius:4px;}
.msg.bot p{margin:0 0 8px;} .msg.bot p:last-child{margin-bottom:0;}
.chat-input-row{display:flex;gap:8px;position:sticky;bottom:0;}
.chat-input-row input{flex:1;}
.chat-input-row button{width:auto;padding:0 18px;}
.suggest-chip{display:inline-block;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14);
  font-size:12px;color:var(--ink-dim);margin:0 6px 6px 0;}

/* mini bar chart */
.chart-wrap{margin-top:4px;}
.chart-legend{display:flex;gap:14px;margin-bottom:8px;font-size:11px;color:var(--ink-dim);}
.chart-legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
</style>
</head>
<body>

<div id="app" class="app">
  <div id="loader" class="loader">
    <div class="spin"></div>
    <div style="color:var(--ink-dim);font-size:13px;">Loading your affiliate account…</div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
(function(){
"use strict";

/* ============================================================
   1. CONFIG
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBk4WD0D5m6386sb62KC-5KKMpUuOLC9fs",
  authDomain: "lexden-nova.firebaseapp.com",
  projectId: "lexden-nova",
  storageBucket: "lexden-nova.firebasestorage.app",
  messagingSenderId: "421157476875",
  appId: "1:421157476875:web:c42a605fdb056c8282450e"
};

const API_BASE = "https://lexden-nova.onrender.com";
const STORE_URL = "https://lexdendigital.github.io/LEXDEN-NOVA/index.html";

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* ============================================================
   2. ATTRIBUTION CAPTURE — runs before anything else on load.
   ============================================================ */
(function captureAttribution(){
  const p = new URLSearchParams(location.search);
  const ref = p.get('ref');
  const pid = p.get('pid');
  if(!ref) return;
  const key = pid ? ('nova_aff_'+pid) : 'nova_aff_general';
  try{ localStorage.setItem(key, JSON.stringify({ref, ts: Date.now()})); }catch(e){}
})();

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function ripple(e, el){
  const r = document.createElement('span');
  r.className='ripple';
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  r.style.width = r.style.height = size+'px';
  r.style.left = (e.clientX - rect.left - size/2)+'px';
  r.style.top = (e.clientY - rect.top - size/2)+'px';
  el.appendChild(r);
  setTimeout(()=>r.remove(), 500);
}
document.addEventListener('click', function(e){
  const btn = e.target.closest('.btn, .icon-btn, .tab');
  if(btn) ripple(e, btn);
});

/* ============================================================
   3. STATE
   ============================================================ */
let state = {
  user:null, userDoc:null, affiliate:null, settings:null, products:[],
  commissions:[], withdrawals:[], linkStats:{}, dailyStats:[], leaderboard:[],
  banks:[], chatLog:[], route:'dashboard'
};

const money = (n) => '₦'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});

/* ============================================================
   4. AUTH FLOW
   ============================================================ */
auth.onAuthStateChanged(async (user)=>{
  if(!user){ renderSignedOut(); return; }
  state.user = user;

  const userSnap = await db.collection('users').doc(user.uid).get();
  state.userDoc = userSnap.exists ? userSnap.data() : null;
  await mergePendingAttributionsToProfile(user.uid);

  const affSnap = await db.collection('affiliates').doc(user.uid).get();
  if(!affSnap.exists){ renderOnboarding(); return; }
  state.affiliate = affSnap.data();
  if(state.affiliate.status === 'pending'){ renderPendingApproval(); return; }
  if(state.affiliate.status === 'suspended'){ renderSuspended(); return; }

  await loadDashboardData();
  renderShell();
});

async function mergePendingAttributionsToProfile(uid){
  const pending = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf('nova_aff_')===0){
      try{ pending[k]=JSON.parse(localStorage.getItem(k)); }catch(e){}
    }
  }
  if(Object.keys(pending).length===0) return;
  try{ await db.collection('users').doc(uid).set({affiliateAttributions: pending}, {merge:true}); }catch(e){}
}

async function loadDashboardData(){
  // Products live as a `list` array inside catalog/products (same doc
  // index.html's storefront reads). Program settings live in
  // catalog/settings' `content` field — the SAME doc/field every other
  // admin-editable setting in the app uses, edited from Admin ->
  // Affiliate Program in index.html. No separate "affiliateSettings" doc.
  const uid = state.user.uid;
  const thirtyDaysAgo = new Date(); thirtyDaysAgo.setDate(thirtyDaysAgo.getDate()-29);
  const [catalogSnap, settingsSnap, commSnap, wdSnap, linkStatsSnap, dailySnap, lbSnap] = await Promise.all([
    db.collection('catalog').doc('products').get(),
    db.collection('catalog').doc('settings').get(),
    db.collection('affiliateCommissions').where('affiliateId','==',uid).orderBy('createdAt','desc').limit(50).get(),
    db.collection('affiliateWithdrawals').where('affiliateId','==',uid).orderBy('requestedAt','desc').limit(50).get(),
    db.collection('affiliateLinkStats').where('ref','==',uid).get(),
    db.collection('affiliateDailyStats').where('ref','==',uid).get(),
    db.collection('affiliateLeaderboard').orderBy('totalEarned','desc').limit(20).get(),
  ]);
  const content = (settingsSnap.exists && settingsSnap.data().content) || {};
  state.settings = {
    commissionDefaultPct: content.affiliateCommissionDefaultPct ?? 10,
    withdrawalFeePct: content.affiliateWithdrawalFeePct ?? 2.5,
    minWithdrawalNGN: content.affiliateMinWithdrawalNGN ?? 5000,
    whatsappCommunityUrl: content.affiliateWhatsappUrl || '',
    telegramCommunityUrl: content.affiliateTelegramUrl || '',
    inviteBannerText: content.affiliateInviteBannerText || 'Join the private Affiliate community for tips, early product drops and payout announcements.',
  };
  const fullList = (catalogSnap.exists && Array.isArray(catalogSnap.data().list)) ? catalogSnap.data().list : [];
  state.products = fullList.filter(p => p && p.affiliateEnabled === true);
  state.commissions = commSnap.docs.map(d=>({id:d.id, ...d.data()}));
  state.withdrawals = wdSnap.docs.map(d=>({id:d.id, ...d.data()}));

  const linkStats = {};
  linkStatsSnap.forEach(d=>{ linkStats[d.id] = d.data(); });
  state.linkStats = linkStats;

  const daily = [];
  dailySnap.forEach(d=>{
    const v = d.data();
    if(v.date >= thirtyDaysAgo.toISOString().slice(0,10)) daily.push(v);
  });
  daily.sort((a,b)=> a.date < b.date ? -1 : 1);
  state.dailyStats = daily;

  state.leaderboard = lbSnap.docs.map(d=>({id:d.id, ...d.data()}));

  const affSnap = await db.collection('affiliates').doc(uid).get();
  state.affiliate = affSnap.data();
}

/* ============================================================
   5. SCREENS
   ============================================================ */
function root(){ return document.getElementById('app'); }

// No separate affiliate login/signup exists anymore. This page piggybacks
// on the SAME Firebase Auth session as the main Nova store (same project,
// same origin => same persisted session), so a shopper who is already
// signed in on the store lands here already authenticated — this branch
// only runs for someone who opened this page signed OUT of the store.
// Instead of duplicating a signup form (and its own account, disconnected
// from the store profile the affiliate program actually needs), we send
// them to sign in on the store first, then back here.
function renderSignedOut(){
  root().innerHTML = `
  <div class="screen" style="padding-top:16vh;text-align:center;">
    <div style="font-size:22px;font-weight:800;margin-bottom:10px;">Nova <b style="color:var(--gold)">Affiliate</b></div>
    <div class="card" style="text-align:left;">
      <div style="font-weight:700;margin-bottom:6px;">Sign in to your Nova account first</div>
      <div class="hint" style="margin-bottom:16px;">The Affiliate Program is part of your existing Nova store account — there's no separate affiliate login. Sign in (or create a store account) on Nova, then come back here from Profile → Nova Affiliate Program.</div>
      <button class="btn btn-gold" id="btnGoToStore">Go to Nova Store</button>
    </div>
  </div>`;
  document.getElementById('btnGoToStore').onclick = ()=>{ location.href = STORE_URL + '#login'; };
}

/* ---- onboarding, with the Paystack bank dropdown + account verify ---- */
async function renderOnboarding(){
  const d = state.userDoc || {};
  root().innerHTML = `
  <div class="screen">
    <div style="padding-top:8vh;text-align:center;margin-bottom:20px;">
      <div style="font-size:20px;font-weight:800;">Welcome to Lexden Nova <b style="color:var(--gold)">Affiliate</b></div>
      <div class="hint">You're already signed in as ${escapeHtml(state.user.email||'')} — just add your WhatsApp number and payout details below to apply.</div>
    </div>
    <div class="card">
      <div class="field"><label>Full Name</label><input id="obName" value="${escapeHtml(d.displayName||d.name||'')}" placeholder="Full name"></div>
      <div class="field"><label>WhatsApp Number</label><input id="obWhats" type="tel" value="${escapeHtml(d.phone||'')}" placeholder="+234..."></div>
      <div class="field"><label>Bank</label>
        <select id="obBank"><option value="">Loading banks…</option></select>
      </div>
      <div class="field"><label>Account Number</label><input id="obAcctNo" inputmode="numeric" maxlength="10" placeholder="10-digit account number"></div>
      <button type="button" class="btn btn-cyber" id="obVerify" style="margin-bottom:14px;">Verify Account</button>
      <div class="field"><label>Account Name</label><input id="obAcctName" placeholder="Auto-filled after verification" readonly></div>
      <div class="field"><label>Estimated Weekly Reach</label>
        <select id="obReach">
          <option value="under_100">Under 100 people</option>
          <option value="100_500">100 – 500 people</option>
          <option value="500_2000">500 – 2,000 people</option>
          <option value="2000_plus">2,000+ people</option>
        </select>
      </div>
      <div id="obErr" class="err hide"></div>
      <div id="obOk" class="ok-msg hide"></div>
      <button class="btn btn-gold" id="obSubmit">Submit Application</button>
    </div>
  </div>`;
  document.getElementById('obSubmit').onclick = submitOnboarding;
  document.getElementById('obVerify').onclick = verifyOnboardingAccount;
  loadBanksIntoSelect();
}
async function loadBanksIntoSelect(){
  const sel = document.getElementById('obBank');
  try{
    const res = await fetch(`${API_BASE}/api/affiliate-banks`);
    const data = await res.json();
    if(!data.ok) throw new Error(data.error);
    state.banks = data.banks;
    sel.innerHTML = '<option value="">Select your bank</option>' +
      data.banks.map(b=>`<option value="${b.code}">${escapeHtml(b.name)}</option>`).join('');
  }catch(e){
    sel.innerHTML = '<option value="">Could not load banks — check connection</option>';
  }
}
async function verifyOnboardingAccount(){
  const bankCode = document.getElementById('obBank').value;
  const acctNo = document.getElementById('obAcctNo').value.trim();
  const errEl = document.getElementById('obErr'), okEl = document.getElementById('obOk');
  errEl.classList.add('hide'); okEl.classList.add('hide');
  if(!bankCode || acctNo.length < 10){ errEl.textContent='Pick a bank and enter a valid 10-digit account number.'; errEl.classList.remove('hide'); return; }
  const btn = document.getElementById('obVerify');
  btn.disabled = true; btn.textContent = 'Verifying…';
  try{
    const res = await fetch(`${API_BASE}/api/affiliate-resolve-account?account_number=${encodeURIComponent(acctNo)}&bank_code=${encodeURIComponent(bankCode)}`);
    const data = await res.json();
    if(!data.ok) throw new Error(data.error||'Could not verify that account.');
    document.getElementById('obAcctName').value = data.accountName;
    okEl.textContent = 'Verified: '+data.accountName;
    okEl.classList.remove('hide');
  }catch(e){
    errEl.textContent = e.message;
    errEl.classList.remove('hide');
  }
  btn.disabled = false; btn.textContent = 'Verify Account';
}
async function submitOnboarding(){
  const name = document.getElementById('obName').value.trim();
  const whats = document.getElementById('obWhats').value.trim();
  const bankCode = document.getElementById('obBank').value;
  const bankName = document.getElementById('obBank').selectedOptions[0]?.textContent || '';
  const acctNo = document.getElementById('obAcctNo').value.trim();
  const acctName = document.getElementById('obAcctName').value.trim();
  const reach = document.getElementById('obReach').value;
  const errEl = document.getElementById('obErr');
  if(!name || !whats || !bankCode || !acctNo || !acctName){
    errEl.textContent = 'Please fill in every field, and verify your account before submitting.';
    errEl.classList.remove('hide');
    return;
  }
  const btn = document.getElementById('obSubmit');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try{
    await db.collection('affiliates').doc(state.user.uid).set({
      displayName:name, email:state.user.email||'', whatsapp:whats,
      payoutAccount:{bank:bankName, bankCode, accountNumber:acctNo, accountName:acctName},
      targetReach:reach, status:'pending',
      balanceAvailable:0, totalEarned:0, totalWithdrawn:0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    renderPendingApproval();
  }catch(e){
    errEl.textContent = 'Could not submit — check your connection and try again.';
    errEl.classList.remove('hide');
    btn.disabled=false; btn.textContent='Submit Application';
  }
}

function renderPendingApproval(){
  root().innerHTML = `
  <div class="screen loader" style="padding-top:0;">

// Hand-rolled inline SVG bar chart — no external chart library dependency,
// consistent with this app's inline-SVG icon approach. Two series (clicks
// in cyber-blue, sales in gold) as paired mini-bars per day.
function renderMiniChart(daily){
  if(!daily || daily.length===0) return `<div class="hint">Not enough activity yet for a chart — check back after your first few clicks.</div>`;
  const w = 480, h = 120, pad = 6;
  const maxClicks = Math.max(1, ...daily.map(d=>d.clicks||0));
  const maxSales = Math.max(1, ...daily.map(d=>d.sales||0));
  const bw = (w - pad*2) / daily.length;
  let bars = '';
  daily.forEach((d,i)=>{
    const x = pad + i*bw;
    const clickH = ((d.clicks||0)/maxClicks) * (h-20);
    const saleH = ((d.sales||0)/maxSales) * (h-20);
    bars += `<rect x="${x}" y="${h-clickH-10}" width="${bw*0.4}" height="${clickH}" fill="#00d4ff" opacity="0.85" rx="1.5"/>`;
    bars += `<rect x="${x+bw*0.45}" y="${h-saleH-10}" width="${bw*0.4}" height="${saleH}" fill="#d4af37" opacity="0.95" rx="1.5"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:110px;">${bars}<line x1="0" y1="${h-10}" x2="${w}" y2="${h-10}" stroke="rgba(255,255,255,.12)"/></svg>`;
}

function screenWithdraw(){
  const a = state.affiliate || {};

    const lastAt = a.lastWithdrawalAt.toDate ? a.lastWithdrawalAt.toDate() : new Date(a.lastWithdrawalAt);
    const nextEligible = addNonSundayDays(lastAt, 7);
    if(new Date() < nextEligible){
      cooldownMsg = `<div class="card" style="border-color:rgba(212,175,55,.3);"><h3>Next Withdrawal Available</h3>
        <div class="big" style="font-size:18px;">${nextEligible.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</div>
        <div class="hint">Withdrawals are once every 7 days (Sundays don't count toward the wait).</div></div>`;
    }
  }
  return `
  <div class="screen">
    <div class="card">
      <h3>Available to Withdraw</h3>
      <div class="big">${money(a.balanceAvailable)}</div>
      <div class="hint">A ${fee}% processing fee applies. Minimum withdrawal ${money(min)}.</div>
    </div>
    ${cooldownMsg}
    <div class="card">
      <div class="field"><label>Amount to withdraw (₦)</label><input id="wdAmount" type="number" inputmode="numeric" placeholder="e.g. 10000"></div>
      <div id="wdPreview" class="hint" style="margin-bottom:12px;"></div>

/* ---- shared event wiring ---- */
function wireScreenEvents(){
  document.querySelectorAll('.btnCopy').forEach(b=>{
    b.onclick = ()=>{ const url = b.closest('.link-row').dataset.url; navigator.clipboard && navigator.clipboard.writeText(url); toast('Link copied'); };
  });
  document.querySelectorAll('.btnShare').forEach(b=>{
    b.onclick = ()=>{
      const url = b.closest('.link-row').dataset.url;
      if(navigator.share){ navigator.share({url, title:'Check this out on LEXDEN NOVA'}); }
      else { navigator.clipboard && navigator.clipboard.writeText(url); toast('Link copied'); }
    };
  });
  const wdAmount = document.getElementById('wdAmount');
  if(wdAmount){
    wdAmount.oninput = ()=>{
      const amt = parseFloat(wdAmount.value||'0');
      const fee = state.settings.withdrawalFeePct;
      const feeAmt = amt*fee/100;
      document.getElementById('wdPreview').textContent =
        amt>0 ? `You'll receive ${money(amt-feeAmt)} after the ${fee}% fee (${money(feeAmt)}).` : '';
    };
  }
  const wdSubmit = document.getElementById('wdSubmit');
  if(wdSubmit) wdSubmit.onclick = submitWithdrawal;
  const signOut = document.getElementById('btnSignOut');
  if(signOut) signOut.onclick = ()=>auth.signOut();
  const chatSend = document.getElementById('chatSend');
  if(chatSend) chatSend.onclick = sendChatMessage;
  const chatInput = document.getElementById('chatInput');
  if(chatInput) chatInput.onkeydown = (e)=>{ if(e.key==='Enter') sendChatMessage(); };
  document.querySelectorAll('.suggest-chip').forEach(c=>{
    c.onclick = ()=>{ document.getElementById('chatInput').value = c.dataset.q; sendChatMessage(); };
  });
}

async function submitWithdrawal(){
  const amt = parseFloat((document.getElementById('wdAmount').value||'0'));
  const errEl = document.getElementById('wdErr');
  errEl.classList.add('hide');
  const min = state.settings.minWithdrawalNGN;
  const avail = (state.affiliate||{}).balanceAvailable || 0;
  if(!amt || amt < min){ errEl.textContent = `Minimum withdrawal is ${money(min)}.`; errEl.classList.remove('hide'); return; }
  if(amt > avail){ errEl.textContent = 'That exceeds your available balance.'; errEl.classList.remove('hide'); return; }
  const btn = document.getElementById('wdSubmit');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try{
    const idToken = await state.user.getIdToken();
    const res = await fetch(`${API_BASE}/api/affiliate-withdraw`, {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+idToken},
      body: JSON.stringify({amount: amt})
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error||'Request failed');
    toast('Withdrawal requested');
    await loadDashboardData();
    renderShell();
  }catch(e){
    errEl.textContent = e.message || 'Something went wrong — try again.';
    errEl.classList.remove('hide');
    btn.disabled=false; btn.textContent='Request Withdrawal';
  }
}

async function sendChatMessage(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  state.chatLog.push({role:'user', text});
  state.chatLog.push({role:'bot', html:'<p><em>Thinking…</em></p>', pending:true});
  renderChatLogOnly();
  const totalClicks = Object.values(state.linkStats).reduce((s,l)=>s+(l.clicks||0),0);
  const totalSales = Object.values(state.linkStats).reduce((s,l)=>s+(l.sales||0),0);
  const links = Object.entries(state.linkStats).map(([k,v])=>({
    name: v.pid ? (state.products.find(p=>p.id===v.pid)?.name || v.pid) : 'General store link',
    clicks: v.clicks||0, sales: v.sales||0,
  }));
  try{
    const res = await fetch(`${API_BASE}/api/affiliate-ai`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        message:text,
        stats:{
          totalClicks, totalSales,
          totalEarned:(state.affiliate||{}).totalEarned||0,
          balanceAvailable:(state.affiliate||{}).balanceAvailable||0,
          links,
        }
      })
    });
    const data = await res.json();
    state.chatLog.pop(); // remove the "Thinking…" placeholder
    state.chatLog.push({role:'bot', html: data.html || `<p>${escapeHtml(data.text||"Sorry, I couldn't respond.")}</p>`});
  }catch(e){
    state.chatLog.pop();
    state.chatLog.push({role:'bot', html:'<p>Could not reach the assistant — check your connection and try again.</p>'});
  }
  renderChatLogOnly();
}
function renderChatLogOnly(){
  const el = document.getElementById('chatLog');
  if(!el) return;
  el.innerHTML = state.chatLog.map(m=>`<div class="msg ${m.role}">${m.role==='bot'?m.html:escapeHtml(m.text)}</div>`).join('');
  scrollChatToBottom();
}
function scrollChatToBottom(){
  const el = document.getElementById('chatLog');
  if(el) el.scrollTop = el.scrollHeight;
}

/* ============================================================
   7. HELPERS
   ============================================================ */
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtDate(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
// Mirrors the server's addNonSundayDays exactly (api/affiliate/shared.js)
// so the client-shown cooldown date always matches what the backend will
// actually enforce.
function addNonSundayDays(from, n){
  const d = new Date(from.getTime());
  let added = 0;
  while(added < n){ d.setDate(d.getDate()+1); if(d.getDay()!==0) added++; }
  return d;
}
