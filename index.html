     init() below reads ?s= on load and runs it through the exact same
     product search/filter the in-app search bar uses (see boot-time
     query-string handling), so this URL template is genuinely functional,
     not just a schema promise. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "LEXDEN NOVA",
  "url": "https://lexdendigital.github.io/LEXDEN-NOVA/index.html",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://lexdendigital.github.io/LEXDEN-NOVA/index.html?s={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>

<script>
// Set data-theme BEFORE first paint so the boot splash (and the app behind
// it) matches the saved preference instead of always flashing dark — the
// default is now light, so a light-mode visitor would otherwise see a dark
// splash for a split second on every load.
(function(){
  try{
    var raw = localStorage.getItem('ln_theme');
    var theme = raw ? JSON.parse(raw) : 'light';
    document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
  }catch(e){ document.documentElement.setAttribute('data-theme', 'light'); }
})();
</script>
