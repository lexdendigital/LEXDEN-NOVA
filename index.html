@media (min-width:600px){.steps-grid{grid-template-columns:repeat(4,1fr);}}
.step-card{padding:16px;text-align:center;}
.step-num{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin:0 auto 10px;}
.faq-item{border-bottom:1px solid var(--border);padding:14px 0;}
.faq-q{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;cursor:pointer;}
.faq-a{max-height:0;overflow:hidden;transition:max-height .25s var(--ease);color:var(--text-2);font-size:13.5px;}
.faq-item.open .faq-a{max-height:300px;padding-top:10px;}
.faq-item.open .faq-q .chev{transform:rotate(180deg);}
.faq-q .chev{transition:transform .2s var(--ease);}

/* Profile / Menu */
.list-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;}
.list-row .left{display:flex;align-items:center;gap:12px;font-size:14px;}
.list-row .left .ic{font-size:18px;width:22px;text-align:center;}
.switch{width:42px;height:24px;border-radius:14px;background:var(--card);position:relative;transition:background .2s;flex-shrink:0;}
.switch.on{background:var(--accent);}
.switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 4px rgba(0,0,0,0.3);}
.switch.on .knob{transform:translateX(18px);}
.profile-avatar-lg{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;}
/* Profile screen hero — a centered avatar-with-gradient-ring rather than
   a cover-photo banner, so it reads as its own thing rather than copying
   any particular app's profile layout. */
.profile-hero{padding:26px 18px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:18px;}
.profile-hero-avatar-wrap{position:relative;width:88px;height:88px;margin-bottom:12px;}
.profile-hero-avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;display:block;border:3px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box, linear-gradient(135deg,var(--accent),var(--gold)) border-box;}
.profile-hero-avatar-edit{position:absolute;bottom:-2px;right:-2px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#00131a;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--surface);}
.profile-hero-avatar-edit .ic-svg{width:14px;height:14px;stroke:#00131a;}
.profile-hero-name{font-weight:800;font-size:18px;margin-top:2px;}
.profile-hero-sub{color:var(--text-2);font-size:13px;margin-top:2px;}

/* Menu screen socials */
.social-row .ic{font-size:20px;display:inline-flex;align-items:center;justify-content:center;}

/* ============ ADMIN ============ */
.admin-overlay{position:fixed;inset:0;background:var(--bg);z-index:500;overflow-y:auto;font-family:'Inter',sans-serif;}
.admin-login{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px;}
.admin-lock-badge{width:60px;height:60px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--gold);box-shadow:0 0 0 6px color-mix(in srgb, var(--gold) 8%, transparent);}
.admin-lock-badge .ic-svg{width:26px;height:26px;}
.admin-login input{width:260px;max-width:80vw;padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;text-align:center;letter-spacing:2px;}
.admin-shell{display:flex;min-height:100vh;}
.admin-side{width:210px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:16px 10px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.admin-side .atab{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px;color:var(--text-2);margin-bottom:2px;}
.admin-side .atab.active{background:var(--card);color:var(--accent);font-weight:600;}
.admin-side .atab .ic-svg{width:16px;height:16px;flex-shrink:0;}
.admin-main{flex:1;padding:24px;max-width:1100px;}
.admin-main h2{font-size:20px;margin-bottom:16px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px;}
.stat-box{padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--border);}
.stat-box .num{font-size:24px;font-weight:800;font-family:'Space Grotesk';}
.stat-box .lbl{font-size:11.5px;color:var(--text-2);}
.admin-table{width:100%;border-collapse:collapse;font-size:13px;}
.admin-table th{text-align:left;padding:10px;color:var(--text-2);font-weight:600;border-bottom:1px solid var(--border);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;}
.admin-table td{padding:10px;border-bottom:1px solid var(--border);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:640px){.form-grid{grid-template-columns:1fr;}}
.form-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.form-field label{font-size:12px;color:var(--text-2);font-weight:600;}
@media (prefers-reduced-motion: no-preference){
  .form-field input,.form-field select,.form-field textarea{
    padding:9px 11px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:13.5px;
    transition: border-color 0.15s var(--ease-sharp), box-shadow 0.15s var(--ease-sharp), background 0.2s var(--ease-sharp);
  }
  .form-field textarea{resize:vertical;min-height:70px;}
  .form-field input:focus,.form-field select:focus,.form-field textarea:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,217,255,0.15);
  }
}

@media (prefers-reduced-motion: reduce){
  .form-field input,.form-field select,.form-field textarea{
    padding:9px 11px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:13.5px;
  }
  .form-field textarea{resize:vertical;min-height:70px;}
  .form-field input:focus,.form-field select:focus,.form-field textarea:focus{
    outline:none;border-color:var(--accent);
  }
}

/* ============ AUTH SCREENS (Login / Sign up) ============ */
.auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px calc(24px + var(--safe-bottom));background:
  radial-gradient(circle at 15% 8%,rgba(0,217,255,0.16),transparent 45%),
  radial-gradient(circle at 85% 92%,rgba(255,214,10,0.10),transparent 45%),
  linear-gradient(160deg,var(--bg),var(--navy) 120%);}
.auth-card{width:100%;max-width:400px;background:var(--card-glass);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-elevated);backdrop-filter:blur(10px);padding:30px 26px 26px;animation:authFadeIn .4s var(--ease);}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;}
.auth-logo img{width:52px;height:52px;border-radius:14px;object-fit:cover;box-shadow:0 0 22px rgba(0,217,255,0.4);animation:logoPulse 3.2s ease-in-out infinite;}
.auth-logo .name{font-family:'Space Grotesk';font-weight:800;font-size:19px;letter-spacing:-0.01em;}
.auth-title{text-align:center;font-size:21px;margin-bottom:4px;}
.auth-sub{text-align:center;color:var(--text-2);font-size:13px;margin-bottom:22px;}
.auth-divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--text-2);font-size:12px;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.auth-avatar-picker{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.auth-avatar-picker img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--surface);border:1px solid var(--border);}
.auth-switch{text-align:center;font-size:13px;color:var(--text-2);margin-top:16px;}
.auth-switch a{color:var(--accent);font-weight:600;cursor:pointer;}
.auth-back{position:fixed;top:calc(16px + var(--safe-top));left:16px;z-index:5;}
.google-g{width:18px;height:18px;flex-shrink:0;}
.gsi-spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:gsiSpin .8s linear infinite;}
@keyframes gsiSpin{to{transform:rotate(360deg);}}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.mobile-admin-tabs{display:none;}
@media (max-width:768px){
  .admin-side{display:none;}
  .mobile-admin-tabs{display:flex;overflow-x:auto;gap:6px;padding:10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5;}
  .mobile-admin-tabs .atab{white-space:nowrap;background:var(--surface);display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:8px;font-size:12.5px;color:var(--text-2);border:1px solid var(--border);}
  .mobile-admin-tabs .atab.active{background:var(--card);color:var(--accent);border-color:color-mix(in srgb, var(--accent) 40%, var(--border));}
  .mobile-admin-tabs .atab .ic-svg{width:15px;height:15px;}
  .admin-main{padding:16px;}
}
.log-row{font-size:12.5px;color:var(--text-2);padding:8px 0;border-bottom:1px dashed var(--border);}

/* ============ NOVA AI CHAT ============ */
.nova-fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 20px rgba(0,217,255,0.4);z-index:400;animation:novaFloat 3s ease-in-out infinite;transition:transform .15s var(--ease),width .15s var(--ease),border-radius .15s var(--ease);color:#00131a;gap:8px;}
.nova-fab:active{transform:scale(0.9);}
@keyframes novaFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
/* Attention-grab for the feed post's Like/Share row: plays once when the
   feed detail screen first opens (Like shakes, then Share follows shortly
   after) so first-time visitors notice both actions exist, without
   looping forever and becoming annoying. */
@keyframes feedActionPop{
  0%{transform:scale(1) rotate(0);}
  15%{transform:scale(1.12) rotate(-8deg);}
  30%{transform:scale(1.05) rotate(8deg);}
  45%{transform:scale(1.1) rotate(-6deg);}
  60%{transform:scale(1) rotate(4deg);}
  75%{transform:scale(1.04) rotate(0);}
  100%{transform:scale(1) rotate(0);}
}
.feed-like-anim{animation:feedActionPop .7s ease 1;animation-delay:.25s;transform-origin:center;}
.feed-share-anim{animation:feedActionPop .7s ease 1;animation-delay:.85s;transform-origin:center;}
@media (min-width:768px){
  .nova-fab{bottom:24px;right:24px;width:auto;padding:0 20px 0 16px;border-radius:28px;font-size:20px;font-weight:700;}
  .nova-fab .fab-label{display:inline;font-family:'Space Grotesk';font-size:14px;}
}
.nova-fab .fab-label{display:none;}
.nova-panel{position:fixed;right:0;bottom:0;left:0;top:auto;height:82vh;background:var(--surface);border-radius:20px 20px 0 0;z-index:410;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,0.4);transform:translateY(100%);transition:transform .3s var(--ease);border-top:1px solid var(--border);}
.nova-panel.open{transform:translateY(0);}
@media (min-width:768px){
  .nova-panel{left:auto;top:auto;bottom:24px;right:24px;width:400px;height:560px;border-radius:18px;}
}
.nova-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);}
.nova-head .who{display:flex;align-items:center;gap:10px;}
.nova-head .avatar-ai{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:16px;}
.nova-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),#00b8d9);color:#00131a;border-bottom-right-radius:4px;}
.msg.ai{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px;}
.msg.ai a{color:var(--accent);text-decoration:underline;}
.quick-replies{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px;}
.typing-dots{display:flex;gap:4px;padding:10px 13px;background:var(--card);border-radius:14px;width:fit-content;}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--text-2);animation:typingBounce 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.15s;}
.typing-dots span:nth-child(3){animation-delay:.3s;}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}
.nova-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);align-items:center;}
.nova-input-row input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:11px 16px;color:var(--text);font-size:13.5px;outline:none;}
.nova-send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#00131a;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}

/* Modal */
@media (prefers-reduced-motion: no-preference){
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;display:flex;align-items:flex-end;justify-content:center;
    backdrop-filter:blur(2px);animation:backdropFadeIn 0.2s var(--ease-sharp);will-change:backdrop-filter;
  }
  @keyframes backdropFadeIn{ from{ background:rgba(0,0,0,0); } to{ background:rgba(0,0,0,0.6); } }
  
  @media (min-width:768px){.modal-backdrop{align-items:center;}}

    background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;

}

@media (prefers-reduced-motion: reduce){

  }
  @media (min-width:768px){.modal-backdrop{align-items:center;}}
  
  .modal-box{
    background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    padding:20px;border:1px solid var(--border);animation:none;

.modal-box h3{margin-bottom:14px;font-size:17px;}
.close-x{position:absolute;top:14px;right:16px;font-size:20px;color:var(--text-2);}

.back-top{position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-bottom) + 80px);width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:none;align-items:center;justify-content:center;z-index:60;}
.back-top.show{display:flex;}

.particle{position:fixed;border-radius:50%;pointer-events:none;opacity:0.25;z-index:1;background:var(--accent);filter:blur(1px);}
@media (max-width:1023px){.particle{display:none;}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}
}

.mt-8{margin-top:8px;}
.mt-16{margin-top:16px;}
.center{align-items:center;justify-content:center;}
.text-2{color:var(--text-2);}
.small{font-size:12px;}
.divider{height:1px;background:var(--border);margin:16px 0;}

/* ---- Custom dropdown (deliberately NOT a native <select> — see the
   sign-up wizard: onboarding pickers use this in-page list instead of the
   OS/browser picker sheet) ---- */
.csel{position:relative;margin-bottom:0;}
.csel-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13.5px;cursor:pointer;text-align:left;font-family:inherit;}
.csel-btn.placeholder{color:var(--text-2);}
.csel-btn .csel-arrow{transition:transform .15s var(--ease-sharp,ease);color:var(--text-2);font-size:11px;margin-left:8px;}
.csel.open .csel-btn .csel-arrow{transform:rotate(180deg);}
.csel-panel{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);max-height:220px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:80;}
.csel.open .csel-panel{display:block;}
.csel-opt{padding:10px 12px;font-size:13.5px;cursor:pointer;color:var(--text);}
.csel-opt:hover,.csel-opt.active{background:var(--card);color:var(--accent);}

/* Small pill-style variant of the same .csel widget, for compact inline
   dropdowns (sort, currency picker) that sit beside other pill buttons
   instead of filling a form field's full width. Everything else about
   the widget — the open/close JS, the outside-click handler, the
   .csel-opt list — is shared with the full-width form variant above. */
.csel-sm{display:inline-block;width:auto;}
.csel-sm .csel-btn{display:inline-flex;width:auto;padding:7px 12px;border-radius:var(--r-chip);background:var(--card);font-size:12.5px;}
.csel-sm .csel-panel{left:0;right:auto;min-width:140px;}

/* ---- Sign-up wizard ---- */
.wizard-dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px;}
.wizard-dots span{width:7px;height:7px;border-radius:50%;background:var(--border);display:block;}
.wizard-dots span.active{background:var(--accent);width:18px;border-radius:4px;}@keyframes spin{to{transform:rotate(360deg);}}

// Firebase to let you in — it checks these two values locally, instantly,
// even if the network/Firebase is slow or briefly unreachable. This is
// what fixes the "troublesome admin sign-in". Firebase is still used
// behind the scenes (see tryAdminLogin below) so that every edit you make
// keeps syncing to the cloud exactly as before — the login *screen* is
// just no longer blocked waiting for it.
// IMPORTANT: this only gates the ADMIN PORTAL SCREEN in this file. For
// Firestore itself to accept the admin's writes, an account with this
// exact email + password must also exist in Firebase Console → Build →
// Authentication → Users → Add user (create it once, manually — there is
// no public sign-up for this). firestore.rules' isAdmin() checks the
// signed-in Firebase user's email against ADMIN_EMAIL above.
const ADMIN_LOCAL_PASSWORD = "Password15.";
// BUGFIX: this const (like ADMIN_EMAIL above) lives in a `<script type=
// "module">` block, which has its own isolated scope — it was NOT visible
// to tryAdminLogin() in the classic <script> block further down the file.
// Clicking "Unlock" called tryAdminLogin(), which immediately hit a
// `ReferenceError: ADMIN_EMAIL is not defined` on its very first check —
// an uncaught error from a bare onclick="" handler produces no visible
// message, so the button just appeared to do nothing. Mirroring both
// values onto window fixes it; see the two window.__ADMIN_* reads in
// tryAdminLogin().
window.__ADMIN_LOCAL_PASSWORD = ADMIN_LOCAL_PASSWORD;

const fbApp = initializeApp(firebaseConfig);
const fbDb = getFirestore(fbApp);
const fbAuth = getAuth(fbApp);
const googleProvider = new GoogleAuthProvider();

// BUGFIX (shopper sign-in "disappearing" after a few hours, reported on an
// installed Android PWA): Firebase Auth persists the session in IndexedDB.
// Android is free to silently wipe an installed app's site storage — not
// on any fixed schedule, just whenever the OS wants space back — unless
// that storage is explicitly marked "persistent". Asking for persistence
// here doesn't guarantee it's granted, but it removes this as a cause on
// any device where it does succeed. Safe no-op if unsupported/denied.
// On-device debug log — a lightweight substitute for remote/USB debugging
// for anyone testing this PWA on a single phone with no computer to plug
// it into. Every entry is timestamped and kept in localStorage (capped so
// it can't grow forever); visit #debuglog inside the app to read it back
// on the SAME device, any time, even after the app's been closed.
window.__novaLog = function(msg){
  try{
    const KEY = 'ln_debug_log';
    const list = JSON.parse(localStorage.getItem(KEY) || '[]');
    list.push({ t: Date.now(), msg: String(msg) });
    while(list.length > 300) list.shift();
    localStorage.setItem(KEY, JSON.stringify(list));
  }catch(e){}
  console.log(msg);
};

if(navigator.storage && navigator.storage.persist){
  navigator.storage.persist().then(granted=>{
    window.__novaLog('Persistent storage ' + (granted ? 'granted' : 'NOT granted (session may be evicted by the OS)'));
  }).catch(()=>{});
}

// ---- Push notifications (Firebase Cloud Messaging) ----
// PASTE YOUR OWN VAPID KEY HERE: Firebase Console → Project Settings →
// Cloud Messaging → "Web configuration" → Web Push certificates →
// generate/copy the key pair's public key. Without this, notification
// permission requests will quietly fail (nothing breaks, they just won't
// work) — see requestNotificationPermission() below.
const FCM_VAPID_KEY = "PASTE_YOUR_FIREBASE_VAPID_KEY_HERE";
let fbMessaging = null;
window.__enableNotifications = async function(){
  try{
    if(!(await fcmIsSupported())){ toast('Notifications are not supported on this browser.', 'error'); return false; }
    if(FCM_VAPID_KEY.startsWith('PASTE_')){ toast('Notifications are not set up yet — ask the developer to add a VAPID key.', 'error'); return false; }
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ toast('Notifications permission was not granted.', 'error'); return false; }
    if(!fbMessaging) fbMessaging = getMessaging(fbApp);
    const reg = await navigator.serviceWorker.getRegistration('./');
    const token = await getToken(fbMessaging, { vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg });
    if(!token) return false;
    await setDoc(doc(fbDb, "fcmTokens", token), { token, at: new Date().toISOString(), ua: navigator.userAgent.slice(0,120) });
    localStorage.setItem('ln_notif_enabled', '1');
    toast('Notifications enabled — you\'ll get an alert for important updates.', 'success');
    return true;
  }catch(e){
    console.warn('Enable notifications failed', e);
    toast('Could not enable notifications right now.', 'error');
    return false;
  }
};
window.__notificationsEnabled = function(){ return localStorage.getItem('ln_notif_enabled')==='1'; };
// Foreground messages (app open in an active tab) — background messages
// while the app is closed/minimized are handled by firebase-messaging-sw.js.
fcmIsSupported().then(supported=>{
  if(!supported) return;
  fbMessaging = getMessaging(fbApp);
  onMessage(fbMessaging, payload=>{
    const title = payload.notification?.title || 'LEXDEN NOVA';
    const body = payload.notification?.body || '';
    toast(`🔔 ${title} — ${body}`, 'success');
  });
});

// Make these reachable from the existing plain-JS code below:
window.__fb = {
  fbDb, fbAuth, doc, getDoc, setDoc, collection, getDocs, deleteDoc, query, where, orderBy, updateDoc, increment,
  signInWithEmailAndPassword, signOut,
};
// Used by the shopper Profile screen's "confirm your password" step
// before saving profile-info changes (see openProfilePasswordConfirm).
// Email/password shoppers only — a Google-signed shopper has no
// LEXDEN NOVA password to confirm, so that flow is skipped for them.
window.__novaReauth = async function(password){
  const user = fbAuth.currentUser;
  if(!user || !user.email) throw new Error('Not signed in');
  const cred = EmailAuthProvider.credential(user.email, password);
  await reauthenticateWithCredential(user, cred);
};

// Shoppers sign in with Google via this helper (called from the Profile
// screen). Distinct from admin sign-in (email/password, see tryAdminLogin)
// — we tell the two apart below using the Firebase Auth provider id, not
// just "anonymous vs not", so a shopper's Google account is never treated
// as an admin session.
//
// BUGFIX: signInWithPopup silently fails (or throws auth/popup-blocked /
// auth/operation-not-supported-in-this-environment) inside an installed
// PWA (standalone display mode) and inside most in-app browsers, because
// there's no real "opener" window for the popup to talk back to — this is
// exactly the environment this app runs in once someone installs it. In
// that case (and as a fallback if a popup gets blocked even in a normal
// browser tab) we use signInWithRedirect instead, which navigates away and
// back instead of opening a popup. The result of a redirect sign-in is
// picked up by getRedirectResult() below, right after the app reloads.
// BUGFIX (Google sign-in that "never ends" when opened from the home-screen
// icon): this used to route installed-PWA sign-ins straight to
// signInWithRedirect(), on the old assumption that an installed app can't
// open a popup. On Android that assumption is often wrong for apps
// installed via Chrome — but more importantly, redirect is genuinely
// unreliable there: the OS can hand the Google consent screen to a
// separate browser process, and the trip back to the installed app's own
// window never happens — not a slow finish, a sign-in that can never
// complete, no matter how long you wait. Trying signInWithPopup FIRST
// regardless of standalone/installed status — and only falling back to
// redirect if the popup itself is genuinely blocked or unsupported — fixes
// this because a popup either succeeds or fails fast, in the same window,
// with no OS-level handoff involved.
function isStandalonePWA(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
    || window.navigator.standalone === true;
}
// A flag in localStorage (survives the full-page navigation to
// accounts.google.com and back — sessionStorage can be dropped by some
// Android WebViews/PWA shells on that trip) records that a redirect
// sign-in is in flight, so the very next load can tell "no redirect
// happened" apart from "a redirect happened but Firebase came back with
// nothing" and explain the difference instead of just quietly landing
// back on the login screen.
const GSI_PENDING_KEY = 'ln_gsi_pending';
window.__signInWithGoogle = async function(){
  try{
    const result = await signInWithPopup(fbAuth, googleProvider);
    // Google accounts are pre-verified by Google itself, so only Welcome
    // applies here (never Email Verification) — and only for a brand-new
    // account, not a returning sign-in.
    if(getAdditionalUserInfo(result)?.isNewUser){
      noteDeviceSignIn(result.user.uid); // signing up IS the security event; skip the redundant new-device alert
      sendNovaEmail('welcome', { email: result.user.email, name: result.user.displayName }, {}).catch(()=>{});
    }
    return result.user;
  }catch(err){
    if(err && (err.code==='auth/popup-blocked' || err.code==='auth/operation-not-supported-in-this-environment')){
      // Popup genuinely isn't available here — fall back to redirect
      // rather than dead-ending. (This is the one case redirect is still
      // used at all; see the BUGFIX note above for why it's no longer the
      // default for installed apps.)
      localStorage.setItem(GSI_PENDING_KEY, String(Date.now()));
      await signInWithRedirect(fbAuth, googleProvider);
      return null;
    }
    console.warn("Google sign-in failed", err);
    throw err;
  }
};
// Picks up the result of a signInWithRedirect() call above once the page
// reloads after the Google auth flow. Must run once at startup, before
// anything else needs to know the sign-in state.
//
// The flag now stores a timestamp (not just '1') so a flag left behind by
// an attempt the person abandoned days ago (closed the tab mid-flow, etc.)
// doesn't get mistaken for "we're returning from Google right now" on some
// unrelated later visit — only a flag younger than 5 minutes counts.
const __gsiPendingAt = Number(localStorage.getItem(GSI_PENDING_KEY)) || 0;
const __gsiWasPending = __gsiPendingAt > 0 && (Date.now() - __gsiPendingAt) < 5*60*1000;
if(__gsiPendingAt > 0 && !__gsiWasPending) localStorage.removeItem(GSI_PENDING_KEY);
window.__googleRedirectPromise = new Promise(resolve=>{
  let settled = false;
  const finish = (user, opts)=>{
    if(settled) return;
    settled = true;
    localStorage.removeItem(GSI_PENDING_KEY);
    if(opts && opts.error) window.__googleRedirectError = opts.error;
    if(opts && opts.silentFail) window.__googleRedirectSilentFail = true;
    resolve(user || null);
  };
  // BUGFIX ("Finishing Google sign-in…" cover never went away): on some
  // Android browser/WebView combinations, getRedirectResult() has been
  // observed to simply never resolve — no result, no error, nothing — if
  // the storage it relies on got disrupted by the round trip to Google.
  // Previously that meant the promise below (and the loading cover shown
  // while waiting on it) could hang forever with no way back into the app.
  // This hard 10-second timeout guarantees it always settles no matter
  // what the SDK does.
  const timer = setTimeout(()=>{ finish(null, { silentFail: __gsiWasPending }); }, 10000);
  getRedirectResult(fbAuth).then(result=>{
    clearTimeout(timer);
    if(!result && __gsiWasPending){
      // We definitely sent the person to Google (the flag was set) but
      // came back with no user AND no thrown error — Firebase couldn't
      // complete the exchange, most likely because the storage it relies
      // on to match the return trip up with the outbound request didn't
      // survive (common inside an installed PWA/home-screen app on
      // Android, where the OS can hand the Google consent screen to a
      // separate browser process).
      finish(null, { silentFail:true });
      return;
    }
    finish(result ? result.user : null);
    if(result && getAdditionalUserInfo(result)?.isNewUser){
      noteDeviceSignIn(result.user.uid);
      sendNovaEmail('welcome', { email: result.user.email, name: result.user.displayName }, {}).catch(()=>{});
    }
  }).catch(err=>{
    clearTimeout(timer);
    console.warn("Google redirect sign-in failed", err);
    finish(null, { error: err });
  });
});

// Looks up whether an email already has an account, so the Login screen
// can tell "wrong password" apart from "no account exists yet" and offer
// to send the person to Sign Up instead of just saying "incorrect".
// Returns true/false, or null if the check itself couldn't be completed
// (treat null as "unknown" rather than assuming either answer).
window.__checkEmailExists = async function(email){
  try{
    const methods = await fetchSignInMethodsForEmail(fbAuth, email);
    return methods.length > 0;
  }catch(e){
    console.warn("Email existence check failed", e);
    return null;
  }
};

// Shopper email/password sign-in (Login page). Kept separate from
// tryAdminLogin's email/password flow only in intent — isAdminUser()
// below is what actually decides admin vs shopper for any given account,
// so a shopper email/password account is never mistaken for an admin one.
window.__emailSignIn = async function(email, password){
  const result = await signInWithEmailAndPassword(fbAuth, email, password);
  return result.user;
};

// ---- Brevo transactional emails (Welcome, Verify, Reset, Contact,
// Security, Admin) — all sent through the /api/send-email and
// /api/send-auth-email Vercel functions, which are the only things that
// ever hold BREVO_API_KEY. Reuses the SAME Vercel deployment already
// configured for payment verification (Admin → Payments → "Verification
// endpoint URL") rather than adding a second endpoint field to configure —
// send-email.js and send-auth-email.js live in that same /api folder.
function novaApiBase(){
  const ep = DB.content.paymentVerifyEndpoint || DB.content.novaApiEndpoint || '';
  try{ return new URL(ep).origin; }catch(e){ return ''; }
}
async function sendNovaEmail(templateKey, to, params){
  const base = novaApiBase();
  if(!base) { console.warn('sendNovaEmail skipped — no Vercel endpoint configured yet (Admin → Payments)'); return false; }
  try{
    const r = await fetch(base+'/api/send-email', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ templateKey, to, params })
    });
    return r.ok;
  }catch(e){ console.warn('sendNovaEmail failed', templateKey, e); return false; }
}
async function sendNovaAuthEmail(type, email, name){
  const base = novaApiBase();
  if(!base) return false;
  try{
    const r = await fetch(base+'/api/send-auth-email', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ type, email, name })
    });
    return r.ok;
  }catch(e){ console.warn('sendNovaAuthEmail failed', type, e); return false; }
}
// ---- Sign-up email OTP (verify BEFORE the account exists) ----
// Three-step round trip against /api/send-otp, /api/verify-otp and
// /api/confirm-email-verified (all in the same Vercel project as
// send-email.js). Returns {ok, error} shapes so callers can show the
// server's exact message instead of a generic failure.
async function sendSignupOtpCode(email){
  const base = novaApiBase();
  if(!base) return { ok:false, error:'Email service is not configured yet — contact support.' };
  try{
    const r = await fetch(base+'/api/send-otp', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email })
    });
    const data = await r.json().catch(()=>({}));
    if(!r.ok) return { ok:false, error: data.error || 'Could not send the code.' };
    return { ok:true };
  }catch(e){ console.warn('sendSignupOtpCode failed', e); return { ok:false, error:'Network problem — check your connection.' }; }
}
async function verifySignupOtpCode(email, code){
  const base = novaApiBase();
  if(!base) return { ok:false, error:'Email service is not configured yet — contact support.' };
  try{
    const r = await fetch(base+'/api/verify-otp', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, code })
    });
    const data = await r.json().catch(()=>({}));
    if(!r.ok || !data.ok) return { ok:false, error: data.error || 'Could not verify that code.' };
    return { ok:true, verifiedToken: data.verifiedToken };
  }catch(e){ console.warn('verifySignupOtpCode failed', e); return { ok:false, error:'Network problem — check your connection.' }; }
}
async function confirmEmailVerifiedServerSide(uid, email, verifiedToken){
  const base = novaApiBase();
  if(!base || !verifiedToken) return false;
  try{
    const r = await fetch(base+'/api/confirm-email-verified', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ uid, email, verifiedToken })
    });
    return r.ok;
  }catch(e){ console.warn('confirmEmailVerifiedServerSide failed', e); return false; }
}
// "Have we seen this uid sign in on this device before?" — a lightweight,
// no-backend way to fire the Security Alert email on what looks like a new
// device/browser, without building real device-fingerprinting
// infrastructure. Deliberately per-device (localStorage), not per-uid
// globally: a shopper's first sign-in on a SECOND phone should still count
// as "new" for security-alert purposes, same as most real security-alert
// systems key off "new device", not "new account".
function noteDeviceSignIn(uid){
  const key = 'ln_known_device_'+uid;
  if(localStorage.getItem(key)) return false;
  localStorage.setItem(key, String(Date.now()));
  return true;
}

// Forgot-password (Login screen). Sent through Brevo (see sendNovaAuthEmail
// above) so it matches NOVA's own branding instead of Firebase's default
// "via firebaseapp.com" email. Falls back to Firebase's own built-in
// sendPasswordResetEmail only if the Vercel email endpoint isn't
// configured yet (Admin → Payments) — so a shopper is never left with NO
// reset email at all just because Brevo hasn't been set up.
window.__sendPasswordReset = async function(email){
  const sent = await sendNovaAuthEmail('reset', email);
  if(!sent) await sendPasswordResetEmail(fbAuth, email);
};

// Shopper sign-up (Sign-up page). Creates the auth account, sets the
// display name, then hands back the user so the caller can save the
// extra profile fields (address, occupation, photo) to Firestore.
window.__emailSignUp = async function(email, password, displayName){
  const result = await createUserWithEmailAndPassword(fbAuth, email, password);
  if(displayName){
    try{ await updateProfile(result.user, { displayName }); }catch(e){ console.warn('updateProfile failed', e); }
  }
  // BUGFIX: createUserWithEmailAndPassword fires onAuthStateChanged (which
  // builds window.__fbShopper from user.displayName) the moment the account
  // is created — BEFORE the updateProfile() call above has finished. That
  // race left window.__fbShopper.name permanently blank for the rest of the
  // session, which is what made the Profile screen fall back to showing the
  // raw email address where the name should be. Patch it in directly here,
  // now that displayName is guaranteed to be set.
  if(displayName && window.__fbShopper && window.__fbShopper.uid === result.user.uid){
    window.__fbShopper.name = displayName;
  }
  // New account only (createUserWithEmailAndPassword never fires for a
  // returning shopper) — send Welcome. NOT sending a verify-email here
  // anymore: the sign-up wizard now proves the address by OTP code on
  // step 4, BEFORE this function ever runs — see sendSignupOtpCode() /
  // verifySignupOtpCode() and finishSignup()'s confirmEmailVerifiedServerSide()
  // call. Sending a second "click to verify" email after they just typed
  // a code would be confusing and redundant.
  noteDeviceSignIn(result.user.uid); // signing up IS the security event; don't also fire a redundant "new device" alert seconds later
  sendNovaEmail('welcome', { email, name: displayName }, {}).catch(()=>{});
  return result.user;
};

function isAdminUser(user){
  // The admin account is the one specific email/password account matching
  // ADMIN_EMAIL (== firestore.rules' isAdmin()). Shoppers can now also
  // sign up with email/password, so checking the provider alone is no
  // longer enough — it must be THIS email, case-insensitively.
  return !!user && !user.isAnonymous
    && user.providerData.some(p => p.providerId === 'password')
    && (user.email||'').toLowerCase() === ADMIN_EMAIL.toLowerCase();
}

// BUGFIX (this was the actual cause of "signed in with Google, but the
// Profile tab shows signed out again"): signInAnonymously() used to be
// called unconditionally, right here, at page load — running in parallel
// with (not after) the Google redirect sign-in completing. Whichever one
// finished second WON, because signInAnonymously() always replaces
// whatever user is currently signed in. If it landed after the redirect's
// real Google user was set, it silently signed the shopper right back out
// into a fresh anonymous session — with no error, which is exactly what
// was reported. Firebase only ever fires onAuthStateChanged(null) once it
// has fully resolved that there is truly no session at all (nothing
// persisted, no pending redirect) — so starting the anonymous browsing
// session from inside that branch below, instead of eagerly here, makes
// the race impossible: anonymous sign-in can now never run before or
// during a real sign-in.
onAuthStateChanged(fbAuth, user => {
  // DIAGNOSTIC (temporary — helps pin down the "sign-in disappears after a
  // few hours" report): logs every time Firebase re-evaluates auth state,
  // and what it landed on. If a shopper's session vanishes, checking these
  // logs (via chrome://inspect over USB, or a remote-logging tool) will
  // show whether Firebase itself fired user:null (real session loss —
  // storage got wiped) versus the app just failing to reflect a session
  // that's actually still there (a rendering bug, not an auth bug). Safe
  // to remove once the cause is confirmed.
  window.__novaLog('onAuthStateChanged: ' + (user ? (user.isAnonymous ? 'anonymous' : user.uid) : 'null (no session)'));
  // Every branch below runs once Firebase has told us who (if anyone) is
  // signed in — before that, the very first render (fired by init(), well
  // before this listener can possibly have run) has nothing to go on and
  // shows the "Guest Explorer" signed-out card. Without this flag that
  // first paint is indistinguishable from "actually signed out", so a
  // shopper refreshing right after signing up briefly — but visibly —
  // saw their whole profile disappear before this listener caught up.
  // screenProfile() checks this flag and shows a neutral loading state
  // instead, on every load, until the real answer is in.
  window.__fbAuthResolved = true;
  if(user && isAdminUser(user)){
    window.__fbUid = null;
    window.__fbAdminEmail = user.email;
    window.__fbShopper = null;
  } else if(user && !user.isAnonymous){
    // A shopper signed in — either with Google or with email/password
    // via the Sign Up / Login screens.
    const provider = user.providerData.some(p=>p.providerId==='google.com') ? 'google' : 'password';
    window.__fbUid = user.uid;
    window.__fbAdminEmail = null;
    window.__fbShopper = { uid:user.uid, name:user.displayName||'', email:user.email||'', photoURL:user.photoURL||'', provider };
    window.__novaUpsertUserProfile && window.__novaUpsertUserProfile(window.__fbShopper);
    // Security Alert — fires the first time THIS device/browser sees this
    // uid signed in (see noteDeviceSignIn above). A lightweight stand-in
    // for real device-fingerprinting: no new backend infrastructure, but
    // still a genuine "is this you?" signal for a shopper's existing
    // devices staying silent while a genuinely new one gets flagged.
    if(user.email && noteDeviceSignIn(user.uid)){
      sendNovaEmail('security', { email: user.email, name: user.displayName }, {
        event_type: 'New sign-in',
        device: (navigator.userAgentData?.platform || navigator.platform || 'Unknown device'),
        browser: (navigator.userAgentData?.brands?.map(b=>b.brand).join(', ') || navigator.userAgent.split(' ').slice(-1)[0] || 'Unknown browser'),
        location: 'Not available',
        event_time: new Date().toLocaleString('en-GB', { timeZone:'Africa/Lagos' }) + ' WAT',
      }).catch(()=>{});
    }
    // Pull any previously-saved address/occupation so the Profile screen
    // has them without the shopper re-entering them every session.
    if(window.__novaFetchUserProfile){
      window.__novaFetchUserProfile(user.uid).then(profile=>{
        if(profile && window.__fbShopper && window.__fbShopper.uid===user.uid){
          // Fall back to the name saved in Firestore if the live Firebase
          // Auth user still has no displayName for some reason — never
          // leaves name blank (which is what caused the email address to
          // show in its place on the Profile screen).
          if(!window.__fbShopper.name) window.__fbShopper.name = profile.name||'';
          window.__fbShopper.address = profile.address||'';
          window.__fbShopper.occupation = profile.occupation||'';
          window.__fbShopper.gender = profile.gender||'';
          window.__fbShopper.dob = profile.dob||'';
          window.__fbShopper.country = profile.country||'';
          window.__fbShopper.state = profile.state||'';
          window.__fbShopper.howHeard = profile.howHeard||'';
          window.__fbShopper.profileSetupDone = !!profile.profileSetupDone;
          // BUGFIX (uploaded profile picture "disappearing" after signing
          // out and back in): a manual (email/password) account's photo is
          // only ever saved to the Firestore profile doc (photoURL, set at
          // signup) — Firebase AUTH's own user.photoURL field is never
          // populated for password accounts (updateProfile() above only
          // ever sets displayName), so it's permanently blank here. This
          // used to check only the (always-blank) Auth field and, finding
          // it empty, silently replace the shopper's own uploaded photo
          // with the admin's default gender avatar on every fresh sign-in.
          // Now it prefers the Firestore-saved photoURL first, and only
          // falls back to the gender default if the shopper truly never
          // uploaded one.
          if(!window.__fbShopper.photoURL){
            window.__fbShopper.photoURL = profile.photoURL || (window.defaultAvatarForGender ? window.defaultAvatarForGender(profile.gender) : '');
          }
          if(appState.route==='#profile') render();
        }
      });
    }
  } else if(user){
    // Anonymous browsing session.
    window.__fbUid = user.uid;
    window.__fbAdminEmail = null;
    window.__fbShopper = null;
  } else {
    // Firebase has now fully confirmed there is no session of any kind —
    // not persisted, not anonymous, not a completing redirect. Only now is
    // it safe to start an anonymous browsing session (see the BUGFIX note
    // above onAuthStateChanged for why this used to run eagerly instead).
    window.__fbUid = null;
    window.__fbAdminEmail = null;
    window.__fbShopper = null;
    signInAnonymously(fbAuth).catch(err => console.warn("Anon sign-in failed", err));
  }
  // Once we know who we are, pull the shared data and refresh the screen
  window.__novaCloudSync && window.__novaCloudSync();
});

window.__googleSignOut = async function(){
  // BUGFIX: likes (and wishlist) were being read from this DEVICE's
  // localStorage (ln_liked_posts / ln_wishlist) and merged into whichever
  // account happened to be signed in — see pullFeedLikesFromCloud()'s
  // merge step. That merge exists so a GUEST's likes survive their first
  // sign-in, but with nothing clearing it on sign-out, it also meant
  // Account A's likes silently carried over and got written into Account
  // B's cloud doc the moment B signed in on the same device/browser —
  // which is the "already liked" bug reported. Clearing the device-local
  // caches here, before Firebase actually signs out, makes likes (and
  // wishlist) per-account again: the next sign-in starts clean and pulls
  // only that account's own liked posts from the cloud.
  DB.likedPosts = [];
  DB.wishlist = [];
  // No need to also call signInAnonymously() here — signing out fires
  // onAuthStateChanged(null) above, which now starts the anonymous
  // session itself.
  await signOut(fbAuth);
};

function lsGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function lsSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ console.warn('Storage failed', e); }
}

function seedIfNeeded(){
  if(!lsGet(LS_KEYS.seeded, false)){
    lsSet(LS_KEYS.products, DEFAULT_PRODUCTS);
    lsSet(LS_KEYS.categories, DEFAULT_CATEGORIES);
    lsSet(LS_KEYS.testimonials, DEFAULT_TESTIMONIALS);
    lsSet(LS_KEYS.faqs, DEFAULT_FAQS);
    lsSet(LS_KEYS.content, DEFAULT_CONTENT);
    lsSet(LS_KEYS.wishlist, []);
    lsSet(LS_KEYS.feed, DEFAULT_FEED_POSTS);
    lsSet(LS_KEYS.services, DEFAULT_SERVICES);
    lsSet(LS_KEYS.management, DEFAULT_MANAGEMENT);
    lsSet(LS_KEYS.seeded, true);
    logActivity('System', 'App initialized with demo catalog');
  } else {
    // Migration for installs seeded by an older version of this file: fill in
    // any newly-added fields/collections without touching existing admin edits.
    const c = lsGet(LS_KEYS.content, DEFAULT_CONTENT);
    let changed = false;
    Object.keys(DEFAULT_CONTENT).forEach(k=>{ if(!(k in c)){ c[k]=DEFAULT_CONTENT[k]; changed=true; } });
    if(changed) lsSet(LS_KEYS.content, c);
    if(lsGet(LS_KEYS.feed, null)===null) lsSet(LS_KEYS.feed, DEFAULT_FEED_POSTS);
    if(lsGet(LS_KEYS.services, null)===null) lsSet(LS_KEYS.services, DEFAULT_SERVICES);
    if(lsGet(LS_KEYS.management, null)===null) lsSet(LS_KEYS.management, DEFAULT_MANAGEMENT);
  }
}

/* ---------------- CLOUD SYNC (Firebase) ----------------
   IMPORTANT LESSON FROM v1.12: every push function below used to swallow
   its own errors with a silent console.warn(). That meant a permission
   error (e.g. Firestore rules rejecting the write) looked EXACTLY like a
   successful save from the admin's point of view — the toast said
   "Product saved" either way. That's why a test product could be added
   and never show up anywhere else. Every push now surfaces a visible
   toast on failure, and cloudStatus() tracks whether the last attempt
   actually reached the server, shown on the Dashboard tab. */
window.__cloudStatus = { ok:null, lastError:'', lastCheck:null };
function setCloudStatus(ok, err){
  window.__cloudStatus = { ok, lastError: err ? (err.code || err.message || String(err)) : '', lastCheck: new Date().toISOString() };
}
function isPermissionError(e){
  const msg = (e && (e.code||e.message||'')).toString().toLowerCase();
  return msg.includes('permission-denied') || msg.includes('insufficient');
}
function explainCloudError(e){
  if(isPermissionError(e)) return 'Firestore rejected this write (permission-denied). This almost always means your security rules\' admin email doesn\'t match the email you\'re signed in with, or the rules haven\'t been published yet.';
  return 'Could not reach the cloud database — check your data connection.';
}

async function pushProductsToCloud(){
  if(!window.__fb) return false;
  const { fbDb, doc, setDoc } = window.__fb;
  try{
    await setDoc(doc(fbDb, "catalog", "products"), { list: DB.products });
    await setDoc(doc(fbDb, "catalog", "categories"), { list: DB.categories });
    setCloudStatus(true);
    return true;
  }catch(e){
    setCloudStatus(false, e);
    console.warn("Cloud push failed", e);
    toast('⚠️ Cloud save failed — ' + explainCloudError(e), 'error');
    return false;
  }
}

// Everything else an admin edits (branding, currency, hero/about text,
// social links, services, feed posts, team, FAQs, NOVA settings) lives in
// one shared "settings" document so it syncs across every device the same
// way products already do.
async function pushSettingsToCloud(){
  if(!window.__fb) return false;
  const { fbDb, doc, setDoc } = window.__fb;

    await setDoc(doc(fbDb, "catalog", "settings"), {
      content: DB.content, services: DB.services, feed: DB.feed,
      management: DB.management, faqs: DB.faqs,

    setCloudStatus(false, e);
    console.warn("Settings push failed", e);
    toast('⚠️ Cloud save failed — ' + explainCloudError(e), 'error');
    return false;
  }
}

async function pushWishlistToCloud(){

// Reviews are the one piece of "catalog" data any visitor must be able to
// write (submitting a review), not just the admin — so they live in their
// own collection with create:true, separate from the admin-only catalog
// docs. See the security rules block for the matching /reviews rule.
async function pushReviewToCloud(t){
  if(!window.__fb) return false;
  const { fbDb, doc, setDoc } = window.__fb;
  try{
    await setDoc(doc(fbDb, "reviews", t.id), t);
    return true;
  }catch(e){ console.warn("Review push failed", e); toast('Could not save your review to the cloud — it is only visible on this device.', 'error'); return false; }
}
async function pullReviewsFromCloud(){
  if(!window.__fb) return;
  const { fbDb, collection, getDocs } = window.__fb;
  try{
    const snap = await getDocs(collection(fbDb, "reviews"));
    if(!snap.empty){
      const list = [];
      snap.forEach(d=>list.push(d.data()));
      list.sort((a,b)=> new Date(b.date||0) - new Date(a.date||0));
      DB.testimonials = list;
    }
  }catch(e){ console.warn("Reviews pull failed", e); }
}
async function deleteReviewFromCloud(id){
  if(!window.__fb) return;
  const { fbDb, doc, deleteDoc } = window.__fb;
  try{
    await deleteDoc(doc(fbDb, "reviews", id));
    setCloudStatus(true);
  }catch(e){
    setCloudStatus(false, e);
    toast('⚠️ Could not delete review from cloud — ' + explainCloudError(e), 'error');
  }
}

async function pullFromCloud(){
  if(!window.__fb) return;
  const { fbDb, doc, getDoc } = window.__fb;
  try{
    const prodSnap = await getDoc(doc(fbDb, "catalog", "products"));
    if(prodSnap.exists()) DB.products = prodSnap.data().list;

    const catSnap = await getDoc(doc(fbDb, "catalog", "categories"));
    if(catSnap.exists()) DB.categories = catSnap.data().list;

    const settingsSnap = await getDoc(doc(fbDb, "catalog", "settings"));
    if(settingsSnap.exists()){
      const s = settingsSnap.data();
      if(s.content) DB.content = {...DB.content, ...s.content};
      if(s.services) DB.services = s.services;
      if(s.feed) DB.feed = s.feed;
      if(s.management) DB.management = s.management;
      if(s.faqs) DB.faqs = s.faqs;
    }

    await pullReviewsFromCloud();
    await pullFeedLikesFromCloud();
    await pullProductInterestFromCloud();
    await pullFeedViewCountsFromCloud();

    if(window.__fbUid){
      const wishSnap = await getDoc(doc(fbDb, "wishlists", window.__fbUid));
      const cloudIds = wishSnap.exists() ? (wishSnap.data().ids||[]) : [];
      // Merge, don't overwrite: anything the shopper wishlisted as a guest
      // right before signing in (still sitting in DB.wishlist on this
      // device) must not be silently wiped by an older cloud copy. Union
      // the two and push back up so every device converges on the same list.
      const merged = Array.from(new Set([...(DB.wishlist||[]), ...cloudIds]));
      DB.wishlist = merged;
      if(merged.length !== cloudIds.length) pushWishlistToCloud();
    }
    setCloudStatus(true);
  }catch(e){ setCloudStatus(false, e); console.warn("Cloud pull failed", e); }
}

// BUGFIX (round 2 — "signed in as a different account, feed was already
// liked"): the previous fix only cleared DB.likedPosts/DB.wishlist inside
// the explicit Sign Out button handler (__googleSignOut). That's not the
// only way this device's active account can change — e.g. tapping
// "Continue with Google" again while ALREADY signed in and picking a
// different Google account from the picker swaps the Firebase user
// directly, without ever going through Sign Out, so that clear never ran
// and Account A's locally-cached likes/wishlist survived into Account B's
// first sync. Rather than trying to catch every place an account switch
// can originate, this guards the one place all of them funnel through:
// window.__novaCloudSync, which onAuthStateChanged calls on every single
// identity change no matter what caused it. It remembers the uid this
// device last actually synced as (ln_last_identity), and whenever that
// uid changes to a DIFFERENT real shopper — or drops to guest/signed-out —
// it wipes the local caches before pullFromCloud()'s merge runs, so the
// new identity always starts from its own cloud data only. The one case
// this deliberately still allows through un-wiped is guest → first-ever
// sign-in (lastUid null, currentUid set), which is what lets a genuine
// guest's pre-signup likes carry into their brand new account.
function guardAccountSwitch(){
  const currentUid = window.__fbShopper ? window.__fbShopper.uid : null; // null = guest/admin
  let last = null;
  try{ last = JSON.parse(localStorage.getItem('ln_last_identity')||'null'); }catch(e){}
  const lastUid = last && last.uid || null;
  if(lastUid && lastUid !== currentUid){
    DB.likedPosts = [];
    DB.wishlist = [];
  }
  localStorage.setItem('ln_last_identity', JSON.stringify({ uid: currentUid }));
}

window.__novaCloudSync = async function(){
  guardAccountSwitch();
  await pullFromCloud();
  // BUGFIX: this used to call render() unconditionally. Firebase's
  // onAuthStateChanged (and therefore this sync) can fire mid-flight while
  // someone is still filling in or submitting the Sign Up / Login screens
  // — those screens don't show any cloud data, so re-rendering them here
  // serves no purpose and only risks replacing the exact DOM nodes
  // finishSignup()/handleEmailLogin() are about to update, making the
  // in-progress submission look frozen even once it actually finishes.
  const hash = location.hash;
  if(hash !== '#signup' && hash !== '#login'){
    render();
  }
  syncWishIcons();
};

/* ---------------- SHOPPER PROFILES ('users' collection) ----------------
   Separate from the admin account: admin signs in with email/password
   (see tryAdminLogin) and is never written here. Every shopper who signs
   in with Google gets/updates a doc at users/{uid}. */
window.__novaUpsertUserProfile = async function(shopper){
  if(!window.__fb || !shopper) return;
  const { fbDb, doc, getDoc, setDoc } = window.__fb;
  try{
    const ref = doc(fbDb, "users", shopper.uid);
    const existing = await getDoc(ref);
    const prior = existing.exists() ? existing.data() : {};
    await setDoc(ref, {
      uid: shopper.uid,
      name: shopper.name || prior.name || '',
      email: shopper.email || prior.email || '',
      photoURL: shopper.photoURL || prior.photoURL || '',
      address: shopper.address !== undefined ? shopper.address : (prior.address||''),
      occupation: shopper.occupation !== undefined ? shopper.occupation : (prior.occupation||''),
      gender: shopper.gender !== undefined ? shopper.gender : (prior.gender||''),
      dob: shopper.dob !== undefined ? shopper.dob : (prior.dob||''),
      country: shopper.country !== undefined ? shopper.country : (prior.country||''),
      state: shopper.state !== undefined ? shopper.state : (prior.state||''),
      howHeard: shopper.howHeard !== undefined ? shopper.howHeard : (prior.howHeard||''),
      // Set once — either by saving or explicitly skipping the "finish
      // your profile" card — so a Google shopper is only ever asked for
      // the details Google didn't supply ONE time, the first time they
      // use that email, never again on later logins.
      profileSetupDone: shopper.profileSetupDone !== undefined ? shopper.profileSetupDone : (prior.profileSetupDone||false),
      provider: shopper.provider || prior.provider || 'google',
      updatedAt: new Date().toISOString(),
      createdAt: prior.createdAt || new Date().toISOString(),
    }, { merge:true });
  }catch(e){ console.warn("User profile save failed", e); }
};
window.__novaFetchUserProfile = async function(uid){
  if(!window.__fb || !uid) return null;
  const { fbDb, doc, getDoc } = window.__fb;
  try{
    const snap = await getDoc(doc(fbDb, "users", uid));
    return snap.exists() ? snap.data() : null;
  }catch(e){ console.warn("User profile fetch failed", e); return null; }
};

/* ---------------- ORDERS ----------------
   Orders are written server-side only (by the /api/verify-paystack
   serverless function, using the Firebase Admin SDK, AFTER it has
   independently verified the transaction with Paystack). The client never
   writes to /orders — it only ever reads its own — so a shopper can't
   fabricate a "paid" order by calling Firestore directly. See
   firestore.rules for the matching read-only-own-orders rule. */
async function fetchMyOrders(){
  if(!window.__fb || !window.__fbUid) return [];
  const { fbDb, collection, getDocs, query, where, orderBy } = window.__fb;
  try{
    const q = query(collection(fbDb, "orders"), where("uid", "==", window.__fbUid), orderBy("timestamp", "desc"));
    const snap = await getDocs(q);
    const list = [];
    snap.forEach(d=>list.push({ id:d.id, ...d.data() }));
    cacheOrdersForNova(list);
    return list;
  }catch(e){
    console.warn("Fetch orders failed", e);
    return [];
  }
}

/* ---------------- CHECKOUT ----------------
   startCheckout() is the single entry point the UI calls. It dispatches
   to whichever gateway is configured (DB.content.paymentGateway), so
   adding Flutterwave or another provider later means writing one new
   startXFlutterwaveCheckout()-style function and adding one case here —
   nothing else in the app needs to change. */
function startCheckout(productId){
  const p = findProduct(productId);
  // A product can be marked to complete payment on another site entirely
  // (e.g. a seller's own Selar/Gumroad page) instead of the in-app Paystack
  // popup. When set, that always wins — checked before the gateway dispatch
  // below so it works no matter which gateway is configured.
  if(p && p.externalPaymentLink){
    logActivity('User', `Sent to external payment link for "${p.name}"`);
    window.open(p.externalPaymentLink, '_blank', 'noopener');
    return;
  }
  const gateway = DB.content.paymentGateway || 'paystack';
  if(gateway === 'paystack') return startPaystackCheckout(productId);
  // Extension point for future gateways, e.g.:
  // if(gateway === 'flutterwave') return startFlutterwaveCheckout(productId);
  // Shoppers never see internal config details — just a plain, friendly
  // message. The specific reason is logged to the console for whoever's
  // debugging, and to the admin dashboard's activity log.
  console.warn(`Checkout attempted with unconfigured gateway "${gateway}"`);
  toast('Checkout is temporarily unavailable. Please try again shortly.', 'error');
}

function startPaystackCheckout(productId){
  const p = findProduct(productId);
  if(!p){ toast('Product not found', 'error'); return; }
  const c = DB.content;
  if(!c.paystackPublicKey){
    // Shopper-facing message stays generic — no mention of "admin" or
    // "Paystack key" — the real reason still goes to the console/log for
    // whoever manages the store.
    console.warn('Checkout blocked: no Paystack public key set in Admin → Payments.');
    logActivity('System', 'A shopper tried to check out before payments were configured.');
    toast('Checkout is temporarily unavailable. Please check back soon.', 'error');
    return;
  }
  if(typeof PaystackPop === 'undefined'){
    toast('Something went wrong loading checkout — check your connection and try again.', 'error');
    return;
  }
  const shopper = window.__fbShopper;
  // Charge in whatever currency the shopper has selected for browsing —
  // but ONLY if this Paystack account can actually settle in it (see the
  // PAYSTACK_CHARGEABLE_CURRENCIES comment near the top of this file).
  // Anything else falls back to NGN rather than opening a popup Paystack
  // will reject, so checkout never silently fails.
  const selectedCode = currentCurrency();
  const chargeCode = PAYSTACK_CHARGEABLE_CURRENCIES.includes(selectedCode)
    ? selectedCode
    : PAYSTACK_FALLBACK_CURRENCY;
  const proceedWithEmail = (email) => {
    const rate = (c.exchangeRates && c.exchangeRates[chargeCode]) || 1;
    // Paystack expects every currency's amount in its smallest subunit
    // (kobo for NGN, cents for USD, etc.) — always base amount * 100,
    // per Paystack's own "Supported currency" docs.
    const amountMajor = Math.round((p.salePrice || p.price) * rate);
    const amountSubunit = amountMajor * 100;
    const reference = 'LN-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
    if(chargeCode !== selectedCode){
      toast(`Checkout isn't set up in ${selectedCode} yet — charging in ${chargeCode} instead.`, 'info');
    }
    const handler = PaystackPop.setup({
      key: c.paystackPublicKey,
      email,
      amount: amountSubunit,
      currency: chargeCode,
      ref: reference,
      metadata: {
        productId: p.id, productName: p.name,
        uid: window.__fbUid || 'guest', custom_fields: [],
      },
      callback: function(response){
        // Record this payment as "pending" the instant Paystack confirms
        // the charge — BEFORE we even try to verify it. This is what
        // makes delivery recoverable: if verification fails right now
        // (dropped connection, server hiccup, popup blocked), the
        // reference isn't lost — it's retried automatically next time the
        // app opens, or manually from Order History, instead of becoming
        // "I paid and got nothing."
        addPendingPayment(response.reference, p, email);
        verifyPaystackPayment(response.reference, p, email, true);
      },
      onClose: function(){
        toast('Checkout closed — no charge was made.', 'info');
      }
    });
    // Brief "contacting payment partner" beat before the Paystack iframe
    // takes over — gives the shopper a moment of reassurance that
    // something is happening rather than the popup appearing to stall
    // or (worse) looking like nothing was tapped at all.
    showPaymentPartnerOverlay();
    setTimeout(()=>{ hidePaymentPartnerOverlay(); handler.openIframe(); }, 3000);
  };
  if(shopper && shopper.email){
    proceedWithEmail(shopper.email);
  } else {
    openCheckoutEmailModal(proceedWithEmail);
  }
}

/* ---------------- PENDING PAYMENTS (client-side delivery safety net) ----
   A Paystack charge succeeding does NOT guarantee our own verify server
   was reachable, or that a popup blocker let the download tab through.
   Every reference gets parked here the instant Paystack confirms it, and
   only removed once we've actually delivered something to the shopper —
   so a dropped connection retries automatically instead of the shopper
   just losing their money's worth. */
function getPendingPayments(){ return lsGet(LS_KEYS.pendingPayments, []); }
function addPendingPayment(reference, product, email){
  const list = getPendingPayments().filter(x=>x.reference!==reference);
  list.push({ reference, productId: product.id, productName: product.name, email, at: new Date().toISOString(), attempts: 0 });
  lsSet(LS_KEYS.pendingPayments, list);
}
function removePendingPayment(reference){
  lsSet(LS_KEYS.pendingPayments, getPendingPayments().filter(x=>x.reference!==reference));
}
function bumpPendingAttempt(reference){
  const list = getPendingPayments();
  const entry = list.find(x=>x.reference===reference);
  if(entry) entry.attempts = (entry.attempts||0) + 1;
  lsSet(LS_KEYS.pendingPayments, list);
}
// Retried on every app load, and whenever the shopper taps "Retry" on a
// pending payment in Order History — silent (no toasts) unless it's a
// manual retry, so a phone that reopens the app with 3 old pendings
// doesn't fire off three toasts unprompted.
async function retryPendingPayments(silent){
  const list = getPendingPayments();
  if(!list.length) return;
  for(const entry of list){
    const product = findProduct(entry.productId);
    if(!product) { removePendingPayment(entry.reference); continue; } // product deleted since — nothing to deliver
    await verifyPaystackPayment(entry.reference, product, entry.email, !silent);
  }
}

/* ---------------- RELIABLE FILE DOWNLOAD ----------------
   window.open()/a plain <a href target=_blank> only *opens* a file for
   cross-origin URLs (Cloudinary, Drive, etc.) — browsers ignore the
   `download` attribute across origins, so a paid PDF just previews in a
   new tab instead of actually saving to the device. That's the exact
   failure this exists to close: fetch the file as a blob first, then
   trigger the save from a same-origin blob: URL, which *does* force a
   real download. Only falls back to opening the link directly (old
   behavior) if the fetch itself is blocked (e.g. a host without CORS
   headers) — so delivery never just silently does nothing. */
async function forceDownloadFile(url, filename){
  if(!url) return false;
  try{
    const res = await fetch(url, { mode:'cors' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const blob = await res.blob();
    const objectUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objectUrl;
    a.download = filename || (url.split('/').pop().split('?')[0]) || 'download';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(objectUrl), 15000);
    return true;
  }catch(e){
    console.warn('Forced download failed — falling back to opening the link directly', e);
    window.open(url, '_blank');
    return false;
  }
}
// Safe embedding of a value inside a single-quoted onclick="...('...')" string.
function jsStr(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
// BUGFIX (signup/login hanging forever): a plain fetch() has no built-in
// timeout — if a request stalls on a flaky connection (very common on
// mobile) instead of failing outright, the await on it just never
// resolves or rejects. That left "Create Account" stuck showing "Creating
// account…" forever with no error, looking like the app had silently
// frozen. Wrapping any await that hits the network in withTimeout()
// guarantees it always settles one way or another within a bounded time.
function withTimeout(promise, ms, timeoutMessage){
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(timeoutMessage || 'Request timed out — check your connection and try again.')), ms);
  });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
}
function downloadFilenameFor(product){
  return ((product && product.name) || 'lexden-nova-file').replace(/[^a-z0-9]+/gi,'-').toLowerCase().replace(/^-+|-+$/g,'') || 'lexden-nova-file';
}

async function verifyPaystackPayment(reference, product, email, showResult){
  const c = DB.content;
  if(!c.paymentVerifyEndpoint){
    if(showResult) showPaymentResultModal({ status:'pending', reference, productName: product && product.name, email, message:'Payment made, but no verification is configured yet — contact support with this reference and we\'ll sort out delivery manually.' });
    return;
  }
  if(showResult) toast('Confirming your payment…', 'info');
  try{
    // FIX (v2.0.1): no client-side timeout previously — an unreachable
    // endpoint (e.g. undeployed/misrouted, same root cause as the NOVA
    // "full brain" issue) could leave this hanging far longer than a
    // shopper would wait, with no feedback. 15s hard cap; the existing
    // retry queue (bumpPendingAttempt) already covers picking it back up.
    const res = await withTimeout(
      fetch(c.paymentVerifyEndpoint, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          reference, uid: window.__fbUid || null, email,
          productId: product.id, productName: product.name,
        }),
      }),
      15000,
      'Payment verification timed out'
    );
    const data = await res.json();
    if(res.ok && data.ok){
      logActivity('User', `Completed payment for ${product.name} (ref ${reference})`);
      removePendingPayment(reference);
      // deliveryLink (an admin-set URL — e.g. a Google Drive folder, a
      // Gumroad receipt page, another download host) takes priority over
      // the directly uploaded fileUrl when both are set, since it's the
      // more deliberate choice for that specific product.
      const openOnDelivery = product.deliveryLink || product.fileUrl;
      if(openOnDelivery){
        // Triple-checked delivery: fetch the file to a blob and force a
        // real save-to-device (see forceDownloadFile above) — never just
        // window.open(), which mobile browsers routinely block when it
        // fires from an async callback, and which only *previews*
        // cross-origin files anyway instead of downloading them. The
        // modal + its own Download button below is the guaranteed
        // fallback either way, so a paid shopper is never left with
        // nothing.
        const filename = downloadFilenameFor(product);
        const downloaded = await forceDownloadFile(openOnDelivery, filename);
        showPaymentResultModal({
          status:'success', reference, downloadLink: openOnDelivery, filename,
          message: downloaded
            ? 'Your file has been downloaded to this device — check your Downloads folder if you don\'t see it pop up.'
            : 'Your file is ready. If it didn\'t download automatically, use the button below.',
        });
      } else {
        showPaymentResultModal({ status:'success', reference, message:'Your order has been saved. You can find it any time in Order History.' });
      }
      if(location.hash === '#orders') render();
    } else {
      bumpPendingAttempt(reference);
      if(showResult) showPaymentResultModal({ status:'pending', reference, productName: product && product.name, email, message: (data.error || 'We couldn\'t verify this payment yet — it\'s saved and will keep retrying automatically.') });
    }
  }catch(e){
    console.warn('Payment verification failed', e);
    bumpPendingAttempt(reference);
    if(showResult) showPaymentResultModal({ status:'pending', reference, productName: product && product.name, email, message:'Could not reach the verification server — your payment is saved and this will retry automatically once you\'re back online.' });
  }
}

const LEADS_MAX_STORED = 20;
async function pushLeadToCloud(data){
  if(!window.__fb) return false;
  const { fbDb, doc, setDoc, collection, getDocs, deleteDoc } = window.__fb;
  try{
    await setDoc(doc(fbDb, "leads", Date.now().toString()), { ...data, at:new Date().toISOString() });
    // Keep only the most recent LEADS_MAX_STORED messages so the admin
    // inbox doesn't grow forever — prune anything older, best-effort.
    try{
      const snap = await getDocs(collection(fbDb, "leads"));
      const all = []; snap.forEach(d=>all.push({ id:d.id, at:d.data().at||'' }));
      all.sort((a,b)=> new Date(b.at||0) - new Date(a.at||0));
      const extra = all.slice(LEADS_MAX_STORED);
      await Promise.all(extra.map(l=>deleteDoc(doc(fbDb, "leads", l.id)).catch(()=>{})));
    }catch(pruneErr){ console.warn('Lead prune failed', pruneErr); }
    return true;
  }catch(e){ console.warn("Lead push failed", e); return false; }
}

/* ---------------- SHOPPER MEMORY (for NOVA AI personalization) ----------------
   Everything here is derived from data the app ALREADY stores on-device
   (activity log, wishlist, cached orders, currency, theme) — no new

   refreshed opportunistically by fetchMyOrders() into LS_KEYS.pendingPayments'
   neighbor below; if that cache is empty NOVA simply omits order-specific
   lines rather than guessing. */
const LS_ORDER_CACHE = 'ln_orders_cache';

// Derives a whole-years-old age from a "YYYY-MM-DD" date-of-birth string.
// Returns null for anything missing/unparseable/out-of-range rather than
// guessing — callers (shopperProfile, NOVA) must treat null as "unknown",
// not as age 0.
function ageFromDob(dob){
  if(!dob) return null;
  const d = new Date(dob);
  if(isNaN(d.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - d.getFullYear();
  const m = now.getMonth() - d.getMonth();
  if(m < 0 || (m===0 && now.getDate() < d.getDate())) age--;
  return (age >= 0 && age < 130) ? age : null;
}
function shopperProfile(){
  const activity = lsGet(LS_KEYS.activityLog, []).filter(e=>e.who==='User');
  const wishlistIds = lsGet(LS_KEYS.wishlist, []);
  const orders = lsGet(LS_ORDER_CACHE, []);
  const products = DB.products;
  const wishlistProducts = wishlistIds.map(id=>products.find(p=>p.id===id)).filter(Boolean);
  // shopper.name/shopper.dob are collected at signup (window.__fbShopper) —
  // surfaced here so NOVA can personalize by first name and adjust tone for
  // a younger audience without every caller re-deriving this itself.
  const shopperAcct = window.__fbShopper || {};
  const firstName = (shopperAcct.name||'').trim().split(/\s+/)[0] || '';
  const age = ageFromDob(shopperAcct.dob);
  const isTeen = age!=null && age < 18;

  // Pull product names/categories mentioned in recent activity strings
  // (view/click events are logged as free text like "Viewed product X")
  // so we can infer interest even without a structured event schema.
  const viewedNames = [];
  const catCounts = {};
  activity.forEach(e=>{
    const m = /Viewed product (.+)|Clicked (.+)|Added to wishlist: (.+)|Searched "(.+)"/.exec(e.what||'');
    if(m){
      const name = m[1]||m[2]||m[3]||m[4];
      if(name) viewedNames.push(name);
    }
  });
  products.forEach(p=>{
    if(viewedNames.some(n=>n && p.name && n.toLowerCase().includes(p.name.toLowerCase().slice(0,10)))){
      catCounts[p.category] = (catCounts[p.category]||0)+1;
    }
  });
  wishlistProducts.forEach(p=>{ catCounts[p.category] = (catCounts[p.category]||0)+2; });
  const topCategory = Object.entries(catCounts).sort((a,b)=>b[1]-a[1])[0]?.[0] || null;

  const firstSeen = activity.length ? activity[activity.length-1].time : null;
  const isReturning = activity.length > 3;
  const purchasedIds = orders.map(o=>o.productId).filter(Boolean);
  const hasPurchased = purchasedIds.length > 0;

  return {
    isReturning, firstSeen, visitCount: activity.length,
    wishlistCount: wishlistProducts.length, wishlistProducts,
    topCategory, orders, hasPurchased, purchasedIds,
    lastActivity: activity.slice(0,6),
    signedIn: !!(window.__fbUid),
    currency: currentCurrency(),
    firstName, age, isTeen,
  };
}
